<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#252b27"><meta name="color-scheme" content="light"><title>Dahlia Diaries</title><style>
@import url('https://fonts.googleapis.com/css2?family=Italianno&family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@400;500;600&display=swap');
:root{--cream:#f4f0e6;--paper:#fffdf8;--ink:#262821;--sage:#718574;--sage2:#dfe5d8;--line:#d8d2c5;--muted:#77786f;--dark:#252b27}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Georgia,'Times New Roman',serif}button,input,select,textarea{font:inherit}.app{max-width:680px;margin:auto;min-height:100vh}.screen{display:none;min-height:100vh}.screen.active{display:block}.topbar{position:sticky;top:0;z-index:10;background:rgba(245,241,231,.96);backdrop-filter:blur(8px);display:flex;align-items:center;gap:12px;padding:18px 18px 14px;border-bottom:1px solid var(--line)}.back{border:0;background:none;font-size:30px;line-height:1;padding:0 8px}.topbar h1{font-size:27px;margin:0;font-weight:500}.content{padding:18px}.cards{display:grid;gap:14px}.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:17px;box-shadow:0 8px 20px rgba(25,30,20,.05)}.cardhead{display:flex;justify-content:space-between;gap:10px}.label{font-size:34px;line-height:1}.possible{font-style:italic;font-size:18px;margin-top:4px}.pill{display:inline-block;margin-top:8px;background:var(--sage2);padding:6px 9px;border-radius:999px;font:10px Arial,sans-serif;letter-spacing:.12em}.stage{margin-top:14px;border-top:1px solid var(--line);padding-top:12px;display:flex;gap:10px;align-items:center;font:12px Arial,sans-serif;letter-spacing:.1em}.stageicon{font-size:24px}.meta{margin-top:10px;color:#686b62;font:13px Arial,sans-serif;line-height:1.5}.card button,.primary,.secondary{border:0;border-radius:12px;padding:12px 14px;margin-top:12px}.card button,.primary{background:var(--dark);color:white}.secondary{background:var(--sage2);color:var(--ink)}.detailHero{display:grid;grid-template-columns:1.05fr .95fr;gap:12px;align-items:center}.sketch{background:#eef0e8;border-radius:18px;padding:8px;min-height:210px;display:flex;align-items:center;justify-content:center}.sketch svg{width:100%;height:190px}.detailName .label{font-size:52px}.detailName .possible{font-size:22px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:14px}.panel h3{font:700 11px Arial,sans-serif;letter-spacing:.15em;margin:0 0 12px;color:#676b61}.stageRow{display:flex;align-items:center;gap:14px}.stageRow .stageicon{font-size:38px}.stageRow b{font:700 16px Arial,sans-serif;letter-spacing:.12em}.progress{display:flex;justify-content:space-between;margin-top:14px}.dot{width:9px;height:9px;border-radius:50%;background:#d0d1ca}.dot.on{background:var(--sage);box-shadow:0 0 0 4px #e4e8df}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.fact{text-align:center;border-right:1px solid var(--line);padding:6px}.fact:last-child{border:0}.fact .ico{font-size:25px}.fact b{display:block;font:700 9px Arial,sans-serif;letter-spacing:.1em;margin:6px 0}.fact span{font:12px Arial,sans-serif;color:#777}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.actions button{border:0;background:#ecefe8;border-radius:12px;padding:12px 6px;font:11px Arial,sans-serif}.form label{display:block;font:700 11px Arial,sans-serif;letter-spacing:.1em;margin:14px 0 6px}.form input,.form select,.form textarea{width:100%;border:1px solid var(--line);background:white;border-radius:12px;padding:12px}.stageChoices{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stageChoice{border:1px solid var(--line);background:white;border-radius:12px;padding:11px;text-align:left}.stageChoice.selected{outline:2px solid var(--sage);background:#eef1e9}.pinched{margin-top:10px;background:#e5eadf;border-radius:10px;padding:9px 11px;font:700 11px Arial,sans-serif;letter-spacing:.08em}.empty{padding:50px 20px;text-align:center;color:var(--muted)}
.home{background:#f4f0e6;min-height:100vh;padding:0 28px 36px;overflow:hidden;color:#293029}.homeHeader{height:64px;margin:0 -28px;background:#252b27;color:#f7f3e9;display:flex;align-items:center;padding:0 20px;gap:15px;font-family:Montserrat,Arial,sans-serif}.homeBack{font-size:34px;font-weight:300;line-height:1}.homeTitle{font-size:17px;font-weight:600}.home .hero{height:410px;position:relative;margin:0 -28px;overflow:hidden}.heroBotanical{position:absolute;left:0;top:0;width:100%;height:285px;object-fit:cover;object-position:center top;opacity:.96}.home .brand{position:absolute;left:0;right:0;top:248px;z-index:2;text-align:center}.home .script{font-family:Italianno,'Snell Roundhand','Segoe Script',cursive;font-size:clamp(82px,23vw,108px);line-height:.72;color:#526957;font-weight:400}.home .diaries{margin:16px auto 0;display:flex;align-items:center;justify-content:center;gap:15px;font-family:'Cormorant Garamond',Georgia,serif;font-size:23px;letter-spacing:.35em;color:#303730}.home .diaries:before,.home .diaries:after{content:'';height:1px;width:43px;background:#768577}.home .diaries span{padding-left:.35em}.home .tag{margin-top:13px;font:500 9px Montserrat,Arial,sans-serif;letter-spacing:.24em;color:#69746a}.home .menu{display:grid;gap:14px;position:relative;z-index:2;margin-top:0}.homeNav{display:flex;align-items:center;min-height:103px;width:100%;border:1px solid #6e806f;border-radius:18px;padding:14px 18px;background:#718574;color:#fff;text-align:left;box-shadow:0 3px 9px rgba(39,54,39,.045)}.homeNavLight{background:#f4f0e6;color:#3e5041;border-color:#8d9b8e}.homeNavIcon{width:61px;height:61px;display:grid;place-items:center;flex-shrink:0;border-right:1px solid currentColor;padding-right:15px;margin-right:18px;opacity:.92}.homeNavIcon svg{width:43px;height:43px}.homeNavCopy{min-width:0;flex:1}.homeNavCopy strong{display:block;font:600 19px 'Cormorant Garamond',Georgia,serif;letter-spacing:.09em}.homeNavCopy small{display:block;margin-top:7px;font:400 12.5px Montserrat,Arial,sans-serif;letter-spacing:-.01em;opacity:.9}.homeNavArrow{font:34px Georgia,serif;margin-left:8px;line-height:1;font-weight:300}.home .quote{text-align:center;margin-top:25px;color:#778476;font:italic 16px Georgia,serif}@media(max-width:375px){.home{padding-left:20px;padding-right:20px}.homeHeader{margin-left:-20px;margin-right:-20px}.home .hero{margin-left:-20px;margin-right:-20px;height:390px}.heroBotanical{height:270px}.home .brand{top:238px}.home .script{font-size:78px}.home .diaries{font-size:20px}.homeNav{min-height:96px;padding:12px 14px}.homeNavIcon{width:57px;height:57px;margin-right:14px}.homeNavCopy strong{font-size:17px}.homeNavCopy small{font-size:11px}}@media(min-width:500px){.home .menu{max-width:530px;margin-left:auto;margin-right:auto}.home .hero{height:435px}.heroBotanical{height:310px}.home .brand{top:270px}}
</style></head><body><main class="app">
<section id="home" class="screen active home"><header class="homeHeader"><span class="homeBack">‹</span><span class="homeTitle">Dahlia Diaries</span></header><div class="hero"><img class="heroBotanical" src="hero-dahlia.jpg" alt=""><div class="brand"><div class="script">Dahlia</div><div class="diaries"><span>DIARIES</span></div><div class="tag">PLANT · GROW · BLOOM · REPEAT</div></div></div><nav class="menu" aria-label="Main navigation"><button class="homeNav" onclick="show('collection')"><span class="homeNavIcon"><svg viewBox="0 0 52 52" fill="none" stroke="currentColor" stroke-width="1.3"><g transform="translate(26 25)"><ellipse cx="0" cy="-13" rx="5" ry="11"/><ellipse cx="0" cy="-13" rx="5" ry="11" transform="rotate(45)"/><ellipse cx="0" cy="-13" rx="5" ry="11" transform="rotate(90)"/><ellipse cx="0" cy="-13" rx="5" ry="11" transform="rotate(135)"/><circle r="5"/></g></svg></span><span class="homeNavCopy"><strong>MY DAHLIAS</strong><small>View & update my collection</small></span><span class="homeNavArrow">›</span></button><button class="homeNav homeNavLight" onclick="show('add')"><span class="homeNavIcon"><svg viewBox="0 0 52 52" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M26 10v32M10 26h32"/></svg></span><span class="homeNavCopy"><strong>ADD DAHLIA</strong><small>Add a new tuber or plant</small></span><span class="homeNavArrow">›</span></button><button class="homeNav" onclick="show('garden')"><span class="homeNavIcon"><svg viewBox="0 0 52 52" fill="none" stroke="currentColor" stroke-width="1.35"><path d="M5 34l20-8 22 8-21 9Z M5 34v7l21 8v-6m21-9v7l-21 8M26 26V8m0 19C12 22 13 13 14 12c10 0 13 8 12 15Zm0-4C38 22 40 12 40 11c-10 0-15 6-14 12Z"/></svg></span><span class="homeNavCopy"><strong>MY GARDEN</strong><small>See where everything is planted</small></span><span class="homeNavArrow">›</span></button></nav><div class="quote">Every bloom has a story</div></section><section id="collection" class="screen"><header class="topbar"><button class="back" onclick="show('home')">‹</button><h1>My Dahlias</h1></header><div class="content"><div id="cards" class="cards"></div></div></section><section id="detail" class="screen"><header class="topbar"><button class="back" onclick="show('collection')">‹</button><h1>Dahlia Details</h1></header><div id="detailBody" class="content"></div></section><section id="edit" class="screen"><header class="topbar"><button class="back" onclick="show('detail')">‹</button><h1>Edit Details</h1></header><div id="editBody" class="content"></div></section><section id="add" class="screen"><header class="topbar"><button class="back" onclick="show('home')">‹</button><h1>Add Dahlia</h1></header><div class="content form"><label>ORIGINAL LABEL / NAME</label><input id="newLabel" placeholder="e.g. EA or Unknown 04"><label>POSSIBLE VARIETY</label><input id="newPossible" placeholder="Optional"><label>LOCATION</label><input id="newLocation" placeholder="e.g. Planter Bed 1 · Back Right"><label>PLANTED DATE</label><input id="newDate" type="date"><button class="primary" onclick="addDahlia()">Add Dahlia</button></div></section><section id="garden" class="screen"><header class="topbar"><button class="back" onclick="show('home')">‹</button><h1>My Garden</h1></header><div class="content"><div id="gardenBody" class="cards"></div></div></section></main><script>
const defaults=[{id:'ea',label:'EA',possible:'Elizabeth Ann',ident:'Possible',location:'Planter Bed 1 · Bottom Left',date:'2026-10-11',stage:'Planted',pinches:[],colour:'Not yet known',size:'Not yet known',height:'Not yet known'},{id:'snc',label:'SNC',possible:'Snow Country',ident:'Possible',location:'Flexi Tub · Tub 1',date:'2026-10-11',stage:'Planted',pinches:[],colour:'Not yet known',size:'Not yet known',height:'Not yet known'},{id:'u1',label:'Unknown 01',possible:'',ident:'Unknown',location:'Planter Bed 1 · Centre Back',date:'2026-10-11',stage:'Planted',pinches:[],colour:'Not yet known',size:'Not yet known',height:'Not yet known'},{id:'u2',label:'Unknown 02',possible:'',ident:'Unknown',location:'Planter Bed 2 · Centre',date:'2026-10-11',stage:'Planted',pinches:[],colour:'Not yet known',size:'Not yet known',height:'Not yet known'},{id:'u3',label:'Unknown 03 / BIGGEST',possible:'',ident:'Unknown',location:'Planter Bed 2 · Centre Middle Front',date:'2026-10-11',stage:'Planted',pinches:[],colour:'Not yet known',size:'Not yet known',height:'Not yet known'}];const stages=['Tuber','Sprouting','Planted','Growing','Budding','Flowering','End of Season'];const icons={Tuber:'🥔',Sprouting:'🌱',Planted:'🌱',Growing:'🌿',Budding:'☘️',Flowering:'✿','End of Season':'🍂'};let dahlias=[];let current='ea';try{dahlias=JSON.parse(localStorage.getItem('dahliaDiaries'))||defaults}catch(e){dahlias=defaults}function save(){try{localStorage.setItem('dahliaDiaries',JSON.stringify(dahlias))}catch(e){}}function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');if(id==='collection')renderCards();if(id==='garden')renderGarden();if(id==='detail')renderDetail();if(id==='edit')renderEdit();scrollTo(0,0)}function niceDate(s){if(!s)return 'Not yet known';const [y,m,d]=s.split('-');return `${d} ${['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'][+m-1]} ${y}`}function openD(id){current=id;show('detail')}function card(d){return `<article class="card"><div class="cardhead"><div><div class="label">${d.label}</div>${d.possible?`<div class="possible">${d.possible}</div>`:''}<span class="pill">IDENTIFICATION: ${d.ident.toUpperCase()}</span></div><div class="stageicon">${icons[d.stage]}</div></div><div class="stage"><span>CURRENT STAGE</span><b>${d.stage.toUpperCase()}</b></div>${d.pinches?.length?`<div class="pinched">✂ PINCHED · ${niceDate(d.pinches[d.pinches.length-1])}</div>`:''}<div class="meta">⌖ ${d.location}<br>Planted ${niceDate(d.date)}</div><button onclick="openD('${d.id}')">View Dahlia</button></article>`}function renderCards(){document.getElementById('cards').innerHTML=dahlias.map(card).join('')}function flowerSVG(){return `<svg viewBox="0 0 220 220" fill="none" stroke="#4d5149" stroke-width="1.2"><g transform="translate(110 104)"><ellipse rx="15" ry="60"/><ellipse rx="15" ry="60" transform="rotate(30)"/><ellipse rx="15" ry="60" transform="rotate(60)"/><ellipse rx="15" ry="60" transform="rotate(90)"/><ellipse rx="15" ry="60" transform="rotate(120)"/><ellipse rx="15" ry="60" transform="rotate(150)"/><circle r="13"/></g><path d="M112 160c-3 21-2 39 2 58"/></svg>`}function renderDetail(){const d=dahlias.find(x=>x.id===current);if(!d)return;let idx=stages.indexOf(d.stage);document.getElementById('detailBody').innerHTML=`<div class="detailHero"><div class="sketch">${flowerSVG()}</div><div class="detailName"><div class="label">${d.label}</div>${d.possible?`<div class="possible">${d.possible}</div>`:''}<span class="pill">IDENTIFICATION: ${d.ident.toUpperCase()}</span></div></div><div class="panel"><h3>CURRENT STAGE</h3><div class="stageRow"><span class="stageicon">${icons[d.stage]}</span><b>${d.stage.toUpperCase()}</b></div><div class="progress">${stages.map((s,i)=>`<span class="dot ${i===idx?'on':''}"></span>`).join('')}</div>${d.pinches?.length?`<div class="pinched">✂ PINCHED · ${niceDate(d.pinches[d.pinches.length-1])}</div>`:''}</div><div class="panel facts"><div class="fact"><div class="ico">〰️</div><b>COLOUR</b><span>${d.colour}</span></div><div class="fact"><div class="ico">✿</div><b>FLOWER SIZE</b><span>${d.size}</span></div><div class="fact"><div class="ico">↕︎🌿</div><b>PLANT HEIGHT</b><span>${d.height}</span></div></div><div class="panel"><div class="meta">⌖ ${d.location}<br>Planted ${niceDate(d.date)}</div></div><div class="panel actions"><button onclick="alert('Diary timeline is next on our build list 🌿')">View Diary</button><button onclick="alert('Photo gallery is next on our build list 📷')">Photos</button><button onclick="show('edit')">Edit Details</button></div>`}function renderEdit(){const d=dahlias.find(x=>x.id===current);document.getElementById('editBody').innerHTML=`<div class="form panel"><label>ORIGINAL LABEL</label><input id="eLabel" value="${d.label}"><label>POSSIBLE VARIETY</label><input id="ePossible" value="${d.possible||''}"><label>IDENTIFICATION</label><select id="eIdent">${['Unknown','Possible','Confirmed'].map(x=>`<option ${x===d.ident?'selected':''}>${x}</option>`).join('')}</select><label>LOCATION</label><input id="eLocation" value="${d.location}"><label>PLANTED DATE</label><input id="eDate" type="date" value="${d.date}"><label>CURRENT STAGE</label><div class="stageChoices">${stages.map(s=>`<button type="button" class="stageChoice ${s===d.stage?'selected':''}" onclick="pickStage('${s}',this)">${icons[s]} ${s}</button>`).join('')}</div><input id="eStage" type="hidden" value="${d.stage}"><label>PINCHING</label>${d.pinches?.length?`<div class="pinched">✂ PINCHED · ${niceDate(d.pinches[d.pinches.length-1])}</div>`:'<div class="meta">No pinch recorded — nothing will show on the main card until you add one.</div>'}<input id="pinchDate" type="date"><button type="button" class="secondary" onclick="recordPinch()">Record Pinch</button><button class="primary" onclick="saveEdit()">Save Changes</button></div>`}function pickStage(s,el){document.getElementById('eStage').value=s;document.querySelectorAll('.stageChoice').forEach(x=>x.classList.remove('selected'));el.classList.add('selected')}function saveEdit(){const d=dahlias.find(x=>x.id===current);d.label=document.getElementById('eLabel').value||d.label;d.possible=document.getElementById('ePossible').value;d.ident=document.getElementById('eIdent').value;d.location=document.getElementById('eLocation').value;d.date=document.getElementById('eDate').value;d.stage=document.getElementById('eStage').value;save();show('detail')}function recordPinch(){const v=document.getElementById('pinchDate').value||new Date().toISOString().slice(0,10);const d=dahlias.find(x=>x.id===current);d.pinches=d.pinches||[];d.pinches.push(v);save();renderEdit()}function addDahlia(){const label=document.getElementById('newLabel').value.trim();if(!label){alert('Give this dahlia a label first 🌱');return}dahlias.push({id:'d'+Date.now(),label,possible:document.getElementById('newPossible').value.trim(),ident:document.getElementById('newPossible').value.trim()?'Possible':'Unknown',location:document.getElementById('newLocation').value.trim()||'Not yet recorded',date:document.getElementById('newDate').value,stage:'Tuber',pinches:[],colour:'Not yet known',size:'Not yet known',height:'Not yet known'});save();show('collection')}function renderGarden(){const groups={};dahlias.forEach(d=>{(groups[d.location]??=[]).push(d)});document.getElementById('gardenBody').innerHTML=Object.entries(groups).map(([loc,ds])=>`<div class="card"><b>${loc}</b><div class="meta">${ds.map(d=>`${d.label}${d.possible?' · '+d.possible:''}`).join('<br>')}</div></div>`).join('')}</script></body></html>
