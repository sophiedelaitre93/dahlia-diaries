px;border:0;border-radius:50%;background:rgba(244,240,230,.9);font:bold 18px Arial;color:#26342b}.tileBody{position:relative;margin-top:-14px;padding:0 13px 13px;z-index:2}.tileName{font-size:42px;line-height:.85;font-weight:600;text-align:right;color:#26342b}.tilePossible{height:34px;text-align:right;font:28px/1 Italianno;color:#536756;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tilePossible.unknown{font:italic 12px/1.4 'Cormorant Garamond';color:#858a82;padding-top:7px}.tileStage{display:grid;grid-template-columns:64px 1fr;gap:8px;align-items:end;margin-top:3px}.stageSketch{width:64px;height:65px;color:#34493c}.stageSketch svg{width:100%;height:100%}.stageInfo{padding-bottom:5px}.stageLabel{font-weight:600;font-size:13px;letter-spacing:.05em;color:#26342b}.dots{display:flex;align-items:center;margin-top:10px}.dots i{width:12px;height:12px;border:1px solid #b9beb5;border-radius:50%;background:#f5f2e8}.dots i.on{background:#28483a;border-color:#28483a}.dots b{height:1px;flex:1;background:#b9beb5}.collectionEmpty{grid-column:1/-1;text-align:center;padding:40px}.bottomNav{position:fixed;z-index:30;bottom:0;left:50%;transform:translateX(-50%);width:min(680px,100%);height:82px;padding:8px 9px calc(7px + env(safe-area-inset-bottom));background:rgba(255,253,248,.98);border-top:1px solid #d5d0c4;display:none;grid-template-columns:repeat(5,1fr)}.bottomNav.show{display:grid}.bottomNav button{border:0;background:none;color:#252b27;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px}.bottomNav button.active{color:#3f5b49;font-weight:700}.bottomNav svg{width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.bottomNav .leafIcon{fill:currentColor;stroke:none}@media(max-width:375px){.collectionGrid{padding:8px 12px;gap:8px}.dahliaTile{min-height:295px}.tileArt{height:174px}.tileName{font-size:37px}.tilePossible{font-size:25px}.tileStage{grid-template-columns:57p arden" class="screen"><header class="topbar"><button class="back" onclick="show('home')">‹</button><h1>My Garden</h1></header></section></main>

<script>const defaults=[{id:'ea',label:'EA',possible:'Elizabeth Ann',stage:'Planted'},{id:'snc',label:'SNC',possible:'Snow Country',stage:'Planted'},{id:'u1',label:'Unknown 01',possible:'',stage:'Planted'},{id:'u2',label:'Unknown 02',possible:'',stage:'Planted'},{id:'u3',label:'Unknown 03 / BIGGEST',possible:'',stage:'Planted'}];const stages=['Tuber','Sprouting','Planted','Growing','Budding','Flowering','End of Season'];let dahlias=[],collectionFilter='All';try{dahlias=JSON.parse(localStorage.getItem('dahliaDiaries'))||defaults}catch(e){dahlias=defaults}function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');bottomNav.classList.toggle('show',id==='collection');if(id==='collection')renderCards();scrollTo(0,0)}function flowerArt(seed){let petals='';for(let i=0;i<16;i++)petals+=`<ellipse class="petal" cx="90" cy="65" rx="12" ry="39" transform="rotate(${i*22.5} 90 95)"/>`;return`<svg class="flowerArt" viewBox="0 0 180 190" aria-hidden="true"><circle class="wash" cx="45" cy="60" r="38"/><circle class="wash" cx="142" cy="78" r="35"/><path class="leaf" d="M18 155Q45 103 76 125Q54 157 18 155M162 150Q132 103 104 127Q129 157 162 150"/>${petals}<circle class="petal" cx="90" cy="95" r="23"/><circle cx="90" cy="95" r="8" fill="#667567"/></svg>`}function stageSketch(s){let p=s==='Sprouting'?'<path d="M8 45c7-13 27-13 34 0-7 8-27 8-34 0Z"/><path d="M25 36V9m0 8c7 0 10-4 11-9-7 0-11 3-11 9Z"/>':s==='Planted'?'<path d="M5 49c11-5 31-5 42 0M26 47V18M26 31c-8 0-13-5-14-11 8 0 14 4 14 11Zm0-7c7 0 12-5 13-11-8 0-13 4-13 11Z"/>':s==='Growing'?'<path d="M5 51c11-4 31-4 42 0M26 49V8M26 38c-9 0-14-5-15-12 9 0 15 4 15 12Zm0-9c8 0 13-5 14-12-9 0-14 4-14 12Zm0-9c-6 0-10-4-11-9 7 0 11 3 11 9Z"/>':s==='Budding'?'<path d="M26 51V22M26 38c-8 0-13-5-14-11 8 0 14 4 14 11Zm0-8c7 0 12-5 13-11-8 0-13 4-13 11Z"/><path d="M26 22c-6-5-5-13 0-17 6 4 7 12 0 17Z"/>':s==='Flowering'?'<circle cx="26" cy="20" r="13"/><path d="M26 33v19M26 39c-8 0-12-4-13-10m13 8c7 0 11-4 12-10"/>':s==='End of Season'?'<path d="M7 50c12-4 27-4 39 0M26 48V20m0 13L14 20m12 9 11-14M14 20c-6-2-8-7-5-11m28 6c6-2 8-7 6-11"/>':'<path d="M8 39c4-13 28-15 36 0-4 12-29 14-36 0Z"/><path d="M13 37 5 31m11 14-5 7m29-9 7 5M25 26c-1-6 1-10 4-14"/>';return`<svg viewBox="0 0 52 58" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`}function renderFilters(){const fs=['All','Planted','Growing','Budding','Flowering'];filters.innerHTML=fs.map(f=>`<button class="filter ${collectionFilter===f?'active':''}" onclick="collectionFilter='${f}';renderCards()">${f.toUpperCase()} (${f==='All'?dahlias.length:dahlias.filter(d=>d.stage===f).length})</button>`).join('')}function renderCards(){renderFilters();const q=(collectionSearch?.value||'').toLowerCase();const shown=dahlias.filter(d=>(collectionFilter==='All'||d.stage===collectionFilter)&&(!q||(d.label+' '+d.possible).toLowerCase().includes(q)));cards.innerHTML=shown.length?shown.map((d,n)=>{let idx=Math.max(0,Math.min(4,stages.indexOf(d.stage))),dots='';for(let i=0;i<5;i++)dots+=`${i?'<b></b>':''}<i class="${i===idx?'on':''}"></i>`;return`<article class="dahliaTile"><div class="tileArt">${flowerArt(n)}<button class="tileMore">•••</button></div><div class="tileBody"><div class="tileName">${d.label}</div><div class="tilePossible ${d.possible?'':'unknown'}">${d.possible||'Variety not yet known'}</div><div class="tileStage"><div class="stageSketch">${stageSketch(d.stage)}</div><div class="stageInfo"><div class="stageLabel">${d.stage.toUpperCase()}</div><div class="dots">${dots}</div></div></div></div></article>`}).join(''):'<div class="collectionEmpty">No dahlias found 🌿</div>'}</script></body></html>
