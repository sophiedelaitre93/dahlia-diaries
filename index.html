<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#252b27"><meta name="color-scheme" content="light"><title>Dahlia Diaries</title><style>
@import url('https://fonts.googleapis.com/css2?family=Italianno&family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@400;500;600&display=swap');
:root{--cream:#f4f0e6;--paper:#fffdf8;--ink:#262821;--sage:#718574;--dark:#35493c}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:'Cormorant Garamond',Georgia,serif}.app{max-width:680px;margin:auto;min-height:100vh}.screen{display:none;min-height:100vh}.screen.active{display:block}button,input{font:inherit}.home{background:var(--cream);padding:0 28px 36px;overflow:hidden}.homeHeader{height:64px;margin:0 -28px;background:#252b27;color:#f7f3e9;display:flex;align-items:center;padding:0 20px;gap:15px;font-family:Montserrat}.homeBack{font-size:34px}.homeTitle{font-size:17px;font-weight:600}.home .hero{height:410px;position:relative;margin:0 -28px;overflow:hidden}.heroBotanical{position:absolute;width:100%;height:285px;object-fit:cover;object-position:center top;opacity:.96}.home .brand{position:absolute;left:0;right:0;top:270px;text-align:center;background:var(--cream);z-index:2}.home .script{font-family:Italianno,cursive;font-size:clamp(82px,23vw,108px);line-height:.66;color:#526957}.home .diaries{margin:-3px auto 0;display:flex;align-items:center;justify-content:center;gap:15px;font-size:23px;letter-spacing:.35em}.home .diaries:before,.home .diaries:after{content:'';height:1px;width:43px;background:#768577}.home .tag{margin-top:13px;font:500 9px Montserrat;letter-spacing:.24em;color:#69746a}.home .menu{display:grid;gap:14px}.homeNav{display:flex;align-items:center;min-height:103px;width:100%;border:1px solid #6e806f;border-radius:18px;padding:14px 18px;background:#718574;color:#fff;text-align:left}.homeNavLight{background:var(--cream);color:#3e5041}.homeNavIcon{width:61px;border-right:1px solid currentColor;margin-right:18px;font-size:28px}.homeNavCopy{flex:1}.homeNavCopy strong{display:block;font-size:19px;letter-spacing:.09em}.homeNavCopy small{display:block;margin-top:7px;font:12px Montserrat}.homeNavArrow{font-size:34px}.home .quote{text-align:center;margin-top:25px;font-style:italic}.topbar{height:70px;display:flex;align-items:center;padding:0 18px;border-bottom:1px solid #d5d0c4}.back{border:0;background:none;font-size:36px}.collection{background:var(--cream);padding-bottom:105px}.collectionHero{padding:22px 20px 15px;border-bottom:1px solid #d7d2c6}.collectionHead{display:flex;align-items:center}.collectionBack,.collectionAdd{border:0;background:none}.collectionBack{font-size:42px}.collectionAdd{margin-left:auto;width:42px;height:42px;border-radius:50%;background:#252b27;color:white;font-size:28px}.collectionTitle{font-size:clamp(38px,10vw,56px);font-weight:500;flex:1}.collectionTag{text-align:center;font:38px/1 Italianno;color:#526957}.collectionTools{padding:14px 18px 6px}.searchWrap{display:flex;align-items:center;background:var(--paper);border:1px solid #ddd8cc;border-radius:28px;padding:0 15px}.searchIcon{width:23px;height:23px;margin-right:10px}.searchWrap input{border:0;outline:0;background:transparent;width:100%;height:48px}.filters{display:flex;gap:9px;overflow:auto;padding:13px 0 5px;scrollbar-width:none}.filter{white-space:nowrap;border:0;border-radius:24px;background:#e9e5da;color:#485148;padding:10px 16px;font-weight:600;letter-spacing:.04em}.filter.active{background:#344a3d;color:#fff}.collectionGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:9px 18px}.dahliaTile{position:relative;overflow:hidden;min-height:330px;background:#faf7ed;border:1px solid #aeb8aa;border-radius:20px;box-shadow:0 2px 8px rgba(53,73,60,.05)}.tileArt{height:205px;position:relative;overflow:hidden;background:#f5f1e7}.flowerPhoto{width:100%;height:100%;object-fit:cover;object-position:center 32%;filter:grayscale(1) sepia(.12) saturate(.45) contrast(.82) brightness(1.1);opacity:.72;transform:scale(1.12)}.tileArt:after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(244,240,230,.04) 45%,#faf7ed 100%)}.tileMore{position:absolute;right:12px;top:12px;z-index:2;width:40px;height:40px;border:0;border-radius:50%;background:rgba(244,240,230,.9);font:bold 18px Arial;color:#26342b}.tileBody{position:relative;margin-top:-25px;padding:0 13px 13px;z-index:2}.tileName{font-size:43px;line-height:.86;font-weight:600;text-align:right;color:#26342b}.tilePossible{height:34px;text-align:right;font:28px/1 Italianno;color:#536756;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tilePossible.unknown{font:italic 12px/1.4 'Cormorant Garamond';color:#858a82;padding-top:7px}.tileStage{display:grid;grid-template-columns:70px 1fr;gap:7px;align-items:end;margin-top:2px}.stageSketch{width:70px;height:68px;color:#34493c}.stageSketch img{display:block;width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}.stageInfo{padding-bottom:5px}.stageLabel{font-weight:600;font-size:13px;letter-spacing:.05em;color:#26342b}.dots{display:flex;align-items:center;margin-top:10px}.dots i{width:12px;height:12px;border:1px solid #b9beb5;border-radius:50%;background:#f5f2e8}.dots i.on{background:#28483a;border-color:#28483a}.dots b{height:1px;flex:1;background:#b9beb5}.bottomNav{position:fixed;z-index:30;bottom:0;left:50%;transform:translateX(-50%);width:min(680px,100%);height:82px;padding:8px 9px calc(7px + env(safe-area-inset-bottom));background:rgba(255,253,248,.98);border-top:1px solid #d5d0c4;display:none;grid-template-columns:repeat(5,1fr)}.bottomNav.show{display:grid}.bottomNav button{border:0;background:none;color:#252b27;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px}.bottomNav button.active{color:#3f5b49;font-weight:700}.bottomNav svg{width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.bottomNav .leafIcon{fill:currentColor;stroke:none}@media(max-width:375px){.collectionGrid{padding:8px 12px;gap:8px}.dahliaTile{min-height:310px}.tileArt{height:190px}.tileName{font-size:38px}.tilePossible{font-size:25px}.tileStage{grid-template-columns:61px 1fr}.stageSketch{width:61px;height:62px}}
</style></head><body><main class="app"><section id="home" class="screen active home"><header class="homeHeader"><span class="homeBack">‹</span><span class="homeTitle">Dahlia Diaries</span></header><div class="hero"><img class="heroBotanical" src="hero-dahlia.jpg?v=7" alt=""><div class="brand"><div class="script">Dahlia</div><div class="diaries">DIARIES</div><div class="tag">PLANT · GROW · BLOOM · REPEAT</div></div></div><nav class="menu"><button class="homeNav" onclick="show('collection')"><span class="homeNavIcon">✿</span><span class="homeNavCopy"><strong>MY DAHLIAS</strong><small>View & update my collection</small></span><span class="homeNavArrow">›</span></button><button class="homeNav homeNavLight" onclick="show('add')"><span class="homeNavIcon">＋</span><span class="homeNavCopy"><strong>ADD DAHLIA</strong><small>Add a new tuber or plant</small></span><span class="homeNavArrow">›</span></button><button class="homeNav" onclick="show('garden')"><span class="homeNavIcon">♧</span><span class="homeNavCopy"><strong>MY GARDEN</strong><small>See where everything is planted</small></span><span class="homeNavArrow">›</span></button></nav><div class="quote">Every bloom has a story</div></section><section id="collection" class="screen collection"><header class="collectionHero"><div class="collectionHead"><button class="collectionBack" onclick="show('home')">‹</button><div class="collectionTitle">MY DAHLIAS</div><button class="collectionAdd" onclick="show('add')">+</button></div><div class="collectionTag">Grow · Track · Bloom</div></header><div class="collectionTools"><label class="searchWrap"><svg class="searchIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg><input id="collectionSearch" placeholder="Search dahlias..." oninput="renderCards()"></label><div id="filters" class="filters"></div></div><div id="cards" class="collectionGrid"></div></section><section id="add" class="screen"><header class="topbar"><button class="back" onclick="show('home')">‹</button><h1>Add Dahlia</h1></header></section><section id="garden" class="screen"><header class="topbar"><button class="back" onclick="show('home')">‹</button><h1>My Garden</h1></header></section></main><nav id="bottomNav" class="bottomNav"><button class="active" onclick="show('collection')"><svg viewBox="0 0 32 32"><path class="leafIcon" d="M15 27V15c-6 1-10-3-10-8 6-1 10 2 10 8 1-7 5-11 12-11 0 7-5 12-12 12v11z"/></svg><span>My Dahlias</span></button><button><svg viewBox="0 0 32 32"><path d="M4 6c5-2 9-1 12 2v20c-3-3-7-4-12-2V6Zm24 0c-5-2-9-1-12 2v20c3-3 7-4 12-2V6Z"/></svg><span>Diary</span></button><button><svg viewBox="0 0 32 32"><rect x="4" y="7" width="24" height="21" rx="2"/><path d="M9 4v6M23 4v6M4 13h24"/></svg><span>Calendar</span></button><button><svg viewBox="0 0 32 32"><rect x="4" y="6" width="24" height="22" rx="2"/><circle cx="11" cy="13" r="2"/><path d="m6 25 7-7 5 5 3-3 5 5"/></svg><span>Photos</span></button><button><svg viewBox="0 0 32 32"><circle cx="7" cy="16" r="1.5" fill="currentColor"/><circle cx="16" cy="16" r="1.5" fill="currentColor"/><circle cx="25" cy="16" r="1.5" fill="currentColor"/></svg><span>More</span></button></nav><script>
const defaults=[{id:'ea',label:'EA',possible:'Elizabeth Ann',stage:'Planted'},{id:'snc',label:'SNC',possible:'Snow Country',stage:'Planted'},{id:'u1',label:'Unknown 01',possible:'',stage:'Planted'},{id:'u2',label:'Unknown 02',possible:'',stage:'Planted'},{id:'u3',label:'Unknown 03 / BIGGEST',possible:'',stage:'Planted'}];const stages=['Tuber','Sprouting','Planted','Growing','Budding','Flowering','End of Season'];let dahlias=[],collectionFilter='All';try{dahlias=JSON.parse(localStorage.getItem('dahliaDiaries'))||defaults}catch(e){dahlias=defaults}function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');bottomNav.classList.toggle('show',id==='collection');if(id==='collection')renderCards();scrollTo(0,0)}
function stageSketch(s){const art={'Tuber':'stage-tuber.svg?v=1','Sprouting':'stage-sprouting.svg?v=1','Planted':'stage-planted.svg?v=1','Growing':'stage-growing.svg?v=1','Budding':'stage-budding.svg?v=1','Flowering':'stage-flowering.svg?v=1','End of Season':'stage-end-season.svg?v=1'};return `<img src="${art[s]||art.Planted}" alt="${s} stage illustration">`}
function renderFilters(){const fs=['All','Planted','Growing','Budding','Flowering'];filters.innerHTML=fs.map(f=>`<button class="filter ${collectionFilter===f?'active':''}" onclick="collectionFilter='${f}';renderCards()">${f.toUpperCase()} (${f==='All'?dahlias.length:dahlias.filter(d=>d.stage===f).length})</button>`).join('')}
function tile(d){let idx=Math.max(0,Math.min(4,stages.indexOf(d.stage))),dots='';for(let i=0;i<5;i++)dots+=`${i?'<b></b>':''}<i class="${i===idx?'on':''}"></i>`;return`<article class="dahliaTile"><div class="tileArt"><img class="flowerPhoto" src="hero-dahlia.jpg?v=7" alt=""><button class="tileMore">•••</button></div><div class="tileBody"><div class="tileName">${d.label}</div><div class="tilePossible ${d.possible?'':'unknown'}">${d.possible||'Variety not yet known'}</div><div class="tileStage"><div class="stageSketch">${stageSketch(d.stage)}</div><div class="stageInfo"><div class="stageLabel">${d.stage.toUpperCase()}</div><div class="dots">${dots}</div></div></div></div></article>`}
function renderCards(){renderFilters();const q=(collectionSearch?.value||'').toLowerCase();const shown=dahlias.filter(d=>(collectionFilter==='All'||d.stage===collectionFilter)&&(!q||(d.label+' '+d.possible).toLowerCase().includes(q)));cards.innerHTML=shown.map(tile).join('')}renderCards();
</script></body></html>
