<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f1e7"><title>Dahlia Diaries</title>
<style>
:root{--cream:#f5f1e7;--paper:#fffdf8;--ink:#262821;--sage:#819077;--sage2:#dfe5d8;--line:#d8d2c5;--muted:#77786f;--dark:#20211d}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Georgia,'Times New Roman',serif}button,input,select,textarea{font:inherit}.app{max-width:680px;margin:auto;min-height:100vh}.screen{display:none;min-height:100vh}.screen.active{display:block}.home{padding:28px 22px 36px;position:relative;overflow:hidden}.hero{min-height:330px;position:relative}.brand{padding-top:28px;position:relative;z-index:2}.script{font-family:'Brush Script MT','Segoe Script',cursive;font-size:64px;line-height:.78;font-weight:400}.diaries{font-size:22px;letter-spacing:.38em;margin-left:8px;margin-top:13px}.tag{font:12px Arial,sans-serif;letter-spacing:.25em;margin-top:18px;color:#596056}.flower{position:absolute;right:-65px;top:-22px;width:290px;height:290px;opacity:.92}.stem{position:absolute;left:-42px;top:130px;width:210px;height:260px;opacity:.6}.menu{display:grid;gap:12px;position:relative;z-index:2}.bigbtn{border:1px solid #bfc7b7;background:rgba(255,253,248,.82);padding:18px;border-radius:18px;text-align:left;box-shadow:0 8px 22px rgba(30,35,25,.06)}.bigbtn b{display:block;font:700 15px Arial,sans-serif;letter-spacing:.12em}.bigbtn span{display:block;margin-top:5px;color:var(--muted);font:13px Arial,sans-serif}.quote{text-align:center;margin-top:35px;font-style:italic;color:#6d7168}.topbar{position:sticky;top:0;z-index:10;background:rgba(245,241,231,.96);backdrop-filter:blur(8px);display:flex;align-items:center;gap:12px;padding:18px 18px 14px;border-bottom:1px solid var(--line)}.back{border:0;background:none;font-size:30px;line-height:1;padding:0 8px}.topbar h1{font-size:27px;margin:0;font-weight:500}.content{padding:18px}.cards{display:grid;gap:14px}.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:17px;box-shadow:0 8px 20px rgba(25,30,20,.05)}.cardhead{display:flex;justify-content:space-between;gap:10px}.label{font-size:34px;line-height:1}.possible{font-style:italic;font-size:18px;margin-top:4px}.pill{display:inline-block;margin-top:8px;background:var(--sage2);padding:6px 9px;border-radius:999px;font:10px Arial,sans-serif;letter-spacing:.12em}.stage{margin-top:14px;border-top:1px solid var(--line);padding-top:12px;display:flex;gap:10px;align-items:center;font:12px Arial,sans-serif;letter-spacing:.1em}.stageicon{font-size:24px}.meta{margin-top:10px;color:#686b62;font:13px Arial,sans-serif;line-height:1.5}.card button,.primary,.secondary{border:0;border-radius:12px;padding:12px 14px;margin-top:12px}.card button,.primary{background:var(--dark);color:white}.secondary{background:var(--sage2);color:var(--ink)}.detailHero{display:grid;grid-template-columns:1.05fr .95fr;gap:12px;align-items:center}.sketch{background:#eef0e8;border-radius:18px;padding:8px;min-height:210px;display:flex;align-items:center;justify-content:center}.sketch svg{width:100%;height:190px}.detailName .label{font-size:52px}.detailName .possible{font-size:22px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:14px}.panel h3{font:700 11px Arial,sans-serif;letter-spacing:.15em;margin:0 0 12px;color:#676b61}.stageRow{display:flex;align-items:center;gap:14px}.stageRow .stageicon{font-size:38px}.stageRow b{font:700 16px Arial,sans-serif;letter-spacing:.12em}.progress{display:flex;justify-content:space-between;margin-top:14px}.dot{width:9px;height:9px;border-radius:50%;background:#d0d1ca}.dot.on{background:var(--sage);box-shadow:0 0 0 4px #e4e8df}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.fact{text-align:center;border-right:1px solid var(--line);padding:6px}.fact:last-child{border:0}.fact .ico{font-size:25px}.fact b{display:block;font:700 9px Arial,sans-serif;letter-spacing:.1em;margin:6px 0}.fact span{font:12px Arial,sans-serif;color:#777}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.actions button{border:0;background:#ecefe8;border-radius:12px;padding:12px 6px;font:11px Arial,sans-serif}.form label{display:block;font:700 11px Arial,sans-serif;letter-spacing:.1em;margin:14px 0 6px}.form input,.form select,.form textarea{width:100%;border:1px solid var(--line);background:white;border-radius:12px;padding:12px}.stageChoices{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stageChoice{border:1px solid var(--line);background:white;border-radius:12px;padding:11px;text-align:left}.stageChoice.selected{outline:2px solid var(--sage);background:#eef1e9}.pinched{margin-top:10px;background:#e5eadf;border-radius:10px;padding:9px 11px;font:700 11px Arial,sans-serif;letter-spacing:.08em}.empty{padding:50px 20px;text-align:center;color:var(--muted)}
</style></head><body><main class="app">
<section id="home" class="screen active home"><div class="hero"><div class="brand"><div class="script">Dahlia</div><div class="diaries">DIARIES</div><div class="tag">PLANT • GROW • BLOOM • REPEAT</div></div>
<svg class="flower" viewBox="0 0 300 300" fill="none" stroke="#42463d" stroke-width="1.15"><g transform="translate(150 145)"><ellipse rx="20" ry="78" transform="rotate(0)"/><ellipse rx="20" ry="78" transform="rotate(30)"/><ellipse rx="20" ry="78" transform="rotate(60)"/><ellipse rx="20" ry="78" transform="rotate(90)"/><ellipse rx="20" ry="78" transform="rotate(120)"/><ellipse rx="20" ry="78" transform="rotate(150)"/><g transform="scale(.65)"><ellipse rx="18" ry="65" transform="rotate(15)"/><ellipse rx="18" ry="65" transform="rotate(45)"/><ellipse rx="18" ry="65" transform="rotate(75)"/><ellipse rx="18" ry="65" transform="rotate(105)"/><ellipse rx="18" ry="65" transform="rotate(135)"/><ellipse rx="18" ry="65" transform="rotate(165)"/></g><circle r="18"/></g></svg>
<svg class="stem" viewBox="0 0 200 280" fill="none" stroke="#66725f" stroke-width="2"><path d="M108 280c-8-78 6-139 30-211"/><path d="M128 106c-44-8-61 13-71 40 34 5 58-7 71-40Z"/><path d="M116 158c35-2 51 14 58 37-29 3-48-8-58-37Z"/><path d="M139 70c-7-28 4-43 24-54 10 22 2 40-24 54Z"/><ellipse cx="163" cy="18" rx="15" ry="20"/></svg></div>
<div class="menu"><button class="bigbtn" onclick="show('collection')"><b>MY DAHLIAS</b><span>View & update my collection</span></button><button class="bigbtn" onclick="show('add')"><b>ADD DAHLIA</b><span>Add a new tuber or plant</span></button><button class="bigbtn" onclick="show('garden')"><b>MY GARDEN</b><span>See where everything is planted</span></button></div><div class="quote">Every bloom has a story</div></section>
<section id="collection" class="screen"><header class="topbar"><button class="back" onclick="show('home')">‹</button><h1>My Dahlias</h1></header><div class="content"><div id="cards" class="cards"></div></div></section>
<section id="detail" class="screen"><header class="topbar"><button class="back" onclick="show('collection')">‹</button><h1>Dahlia Details</h1></header><div id="detailBody" class="content"></div></section>
<section id="edit" class="screen"><header class="topbar"><button class="back" onclick="show('detail')">‹</button><h1>Edit Details</h1></header><div id="editBody" class="content"></div></section>
<section id="add" class="screen"><header class="topbar"><button class="back" onclick="show('home')">‹</button><h1>Add Dahlia</h1></header><div class="content form"><label>ORIGINAL LABEL / NAME</label><input id="newLabel" placeholder="e.g. EA or Unknown 04"><label>POSSIBLE VARIETY</label><input id="newPossible" placeholder="Optional"><label>LOCATION</label><input id="newLocation" placeholder="e.g. Planter Bed 1 · Back Right"><label>PLANTED DATE</label><input id="newDate" type="date"><button class="primary" onclick="addDahlia()">Add Dahlia</button></div></section>
<section id="garden" class="screen"><header class="topbar"><button class="back" onclick="show('home')">‹</button><h1>My Garden</h1></header><div class="content"><div id="gardenBody" class="cards"></div></div></section>
</main><script>
const defaults=[
{id:'ea',label:'EA',possible:'Elizabeth Ann',ident:'Possible',location:'Planter Bed 1 · Bottom Left',date:'2026-10-11',stage:'Planted',pinches:[],colour:'Not yet known',size:'Not yet known',height:'Not yet known'},
{id:'snc',label:'SNC',possible:'Snow Country',ident:'Possible',location:'Flexi Tub · Tub 1',date:'2026-10-11',stage:'Planted',pinches:[],colour:'Not yet known',size:'Not yet known',height:'Not yet known'},
{id:'u1',label:'Unknown 01',possible:'',ident:'Unknown',location:'Planter Bed 1 · Centre Back',date:'2026-10-11',stage:'Planted',pinches:[],colour:'Not yet known',size:'Not yet known',height:'Not yet known'},
{id:'u2',label:'Unknown 02',possible:'',ident:'Unknown',location:'Planter Bed 2 · Centre',date:'2026-10-11',stage:'Planted',pinches:[],colour:'Not yet known',size:'Not yet known',height:'Not yet known'},
{id:'u3',label:'Unknown 03 / BIGGEST',possible:'',ident:'Unknown',location:'Planter Bed 2 · Centre Middle Front',date:'2026-10-11',stage:'Planted',pinches:[],colour:'Not yet known',size:'Not yet known',height:'Not yet known'}];
const stages=['Tuber','Sprouting','Planted','Growing','Budding','Flowering','End of Season'];const icons={Tuber:'🥔',Sprouting:'🌱',Planted:'🌱',Growing:'🌿',Budding:'☘️',Flowering:'✿','End of Season':'🍂'};let dahlias=[];let current='ea';
try{dahlias=JSON.parse(localStorage.getItem('dahliaDiaries'))||defaults}catch(e){dahlias=defaults}function save(){try{localStorage.setItem('dahliaDiaries',JSON.stringify(dahlias))}catch(e){}}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');if(id==='collection')renderCards();if(id==='garden')renderGarden();if(id==='detail')renderDetail();if(id==='edit')renderEdit();scrollTo(0,0)}
function niceDate(s){if(!s)return 'Not yet known';const [y,m,d]=s.split('-');return `${d} ${['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'][+m-1]} ${y}`}
function openD(id){current=id;show('detail')}function card(d){return `<article class="card"><div class="cardhead"><div><div class="label">${d.label}</div>${d.possible?`<div class="possible">${d.possible}</div>`:''}<span class="pill">IDENTIFICATION: ${d.ident.toUpperCase()}</span></div><div class="stageicon">${icons[d.stage]}</div></div><div class="stage"><span>CURRENT STAGE</span><b>${d.stage.toUpperCase()}</b></div>${d.pinches?.length?`<div class="pinched">✂ PINCHED · ${niceDate(d.pinches[d.pinches.length-1])}</div>`:''}<div class="meta">⌖ ${d.location}<br>Planted ${niceDate(d.date)}</div><button onclick="openD('${d.id}')">View Dahlia</button></article>`}
function renderCards(){document.getElementById('cards').innerHTML=dahlias.map(card).join('')}
function flowerSVG(){return `<svg viewBox="0 0 220 220" fill="none" stroke="#4d5149" stroke-width="1.2"><g transform="translate(110 104)"><ellipse rx="15" ry="60"/><ellipse rx="15" ry="60" transform="rotate(30)"/><ellipse rx="15" ry="60" transform="rotate(60)"/><ellipse rx="15" ry="60" transform="rotate(90)"/><ellipse rx="15" ry="60" transform="rotate(120)"/><ellipse rx="15" ry="60" transform="rotate(150)"/><g transform="scale(.62)"><ellipse rx="14" ry="55" transform="rotate(15)"/><ellipse rx="14" ry="55" transform="rotate(45)"/><ellipse rx="14" ry="55" transform="rotate(75)"/><ellipse rx="14" ry="55" transform="rotate(105)"/><ellipse rx="14" ry="55" transform="rotate(135)"/><ellipse rx="14" ry="55" transform="rotate(165)"/></g><circle r="13"/></g><path d="M112 160c-3 21-2 39 2 58"/><path d="M113 181c-27-7-39 4-46 21 22 4 37-3 46-21Z"/></svg>`}
function renderDetail(){const d=dahlias.find(x=>x.id===current);if(!d)return;let idx=stages.indexOf(d.stage);document.getElementById('detailBody').innerHTML=`<div class="detailHero"><div class="sketch">${flowerSVG()}</div><div class="detailName"><div class="label">${d.label}</div>${d.possible?`<div class="possible">${d.possible}</div>`:''}<span class="pill">IDENTIFICATION: ${d.ident.toUpperCase()}</span></div></div><div class="panel"><h3>CURRENT STAGE</h3><div class="stageRow"><span class="stageicon">${icons[d.stage]}</span><b>${d.stage.toUpperCase()}</b></div><div class="progress">${stages.map((s,i)=>`<span class="dot ${i===idx?'on':''}"></span>`).join('')}</div>${d.pinches?.length?`<div class="pinched">✂ PINCHED · ${niceDate(d.pinches[d.pinches.length-1])}</div>`:''}</div><div class="panel facts"><div class="fact"><div class="ico">〰️</div><b>COLOUR</b><span>${d.colour}</span></div><div class="fact"><div class="ico">✿</div><b>FLOWER SIZE</b><span>${d.size}</span></div><div class="fact"><div class="ico">↕︎🌿</div><b>PLANT HEIGHT</b><span>${d.height}</span></div></div><div class="panel"><div class="meta">⌖ ${d.location}<br>Planted ${niceDate(d.date)}</div></div><div class="panel actions"><button onclick="alert('Diary timeline is next on our build list 🌿')">View Diary</button><button onclick="alert('Photo gallery is next on our build list 📷')">Photos</button><button onclick="show('edit')">Edit Details</button></div>`}
function renderEdit(){const d=dahlias.find(x=>x.id===current);document.getElementById('editBody').innerHTML=`<div class="form panel"><label>ORIGINAL LABEL</label><input id="eLabel" value="${d.label}"><label>POSSIBLE VARIETY</label><input id="ePossible" value="${d.possible||''}"><label>IDENTIFICATION</label><select id="eIdent">${['Unknown','Possible','Confirmed'].map(x=>`<option ${x===d.ident?'selected':''}>${x}</option>`).join('')}</select><label>LOCATION</label><input id="eLocation" value="${d.location}"><label>PLANTED DATE</label><input id="eDate" type="date" value="${d.date}"><label>CURRENT STAGE</label><div class="stageChoices">${stages.map(s=>`<button type="button" class="stageChoice ${s===d.stage?'selected':''}" onclick="pickStage('${s}',this)">${icons[s]} ${s}</button>`).join('')}</div><input id="eStage" type="hidden" value="${d.stage}"><label>PINCHING</label>${d.pinches?.length?`<div class="pinched">✂ PINCHED · ${niceDate(d.pinches[d.pinches.length-1])}</div>`:'<div class="meta">No pinch recorded — nothing will show on the main card until you add one.</div>'}<input id="pinchDate" type="date"><button type="button" class="secondary" onclick="recordPinch()">Record Pinch</button><button class="primary" onclick="saveEdit()">Save Changes</button></div>`}
function pickStage(s,el){document.getElementById('eStage').value=s;document.querySelectorAll('.stageChoice').forEach(x=>x.classList.remove('selected'));el.classList.add('selected')}
function saveEdit(){const d=dahlias.find(x=>x.id===current);d.label=document.getElementById('eLabel').value||d.label;d.possible=document.getElementById('ePossible').value;d.ident=document.getElementById('eIdent').value;d.location=document.getElementById('eLocation').value;d.date=document.getElementById('eDate').value;d.stage=document.getElementById('eStage').value;save();show('detail')}
function recordPinch(){const v=document.getElementById('pinchDate').value||new Date().toISOString().slice(0,10);const d=dahlias.find(x=>x.id===current);d.pinches=d.pinches||[];d.pinches.push(v);save();renderEdit()}
function addDahlia(){const label=document.getElementById('newLabel').value.trim();if(!label){alert('Give this dahlia a label first 🌱');return}dahlias.push({id:'d'+Date.now(),label,possible:document.getElementById('newPossible').value.trim(),ident:document.getElementById('newPossible').value.trim()?'Possible':'Unknown',location:document.getElementById('newLocation').value.trim()||'Not yet recorded',date:document.getElementById('newDate').value,stage:'Tuber',pinches:[],colour:'Not yet known',size:'Not yet known',height:'Not yet known'});save();show('collection')}
function renderGarden(){const groups={};dahlias.forEach(d=>{(groups[d.location]??=[]).push(d)});document.getElementById('gardenBody').innerHTML=Object.entries(groups).map(([loc,ds])=>`<div class="card"><b>${loc}</b><div class="meta">${ds.map(d=>`${d.label}${d.possible?' · '+d.possible:''}`).join('<br>')}</div></div>`).join('')}
</script></body></html>
