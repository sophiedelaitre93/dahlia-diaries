<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#252b27"><meta name="color-scheme" content="light"><title>Dahlia Diaries</title><style>
@import url('https://fonts.googleapis.com/css2?family=Italianno&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Montserrat:wght@400;500;600&display=swap');
:root{--cream:#f4f0e6;--paper:#fffdf8;--ink:#262821;--sage:#718574;--sage2:#dfe5d8;--line:#d8d2c5;--dark:#252b27}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Georgia,'Times New Roman',serif}button,input,select{font:inherit}.app{max-width:680px;margin:auto;min-height:100vh}.screen{display:none;min-height:100vh}.screen.active{display:block}.topbar{position:sticky;top:0;z-index:10;background:rgba(245,241,231,.96);display:flex;align-items:center;gap:12px;padding:18px;border-bottom:1px solid var(--line)}.back{border:0;background:none;font-size:30px}.topbar h1{font-size:27px;margin:0;font-weight:500}.content{padding:18px}.card,.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:14px}.label{font-size:34px}.possible{font-style:italic;font-size:18px}.pill{display:inline-block;margin-top:8px;background:var(--sage2);padding:6px 9px;border-radius:999px;font:10px Arial;letter-spacing:.12em}.meta{margin-top:10px;color:#686b62;font:13px Arial;line-height:1.5}.primary,.secondary{border:0;border-radius:12px;padding:12px 14px;margin-top:12px}.primary{background:var(--dark);color:white}.secondary{background:var(--sage2)}.form label{display:block;font:700 11px Arial;letter-spacing:.1em;margin:14px 0 6px}.form input,.form select{width:100%;border:1px solid var(--line);background:white;border-radius:12px;padding:12px}.stageChoices{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stageChoice{border:1px solid var(--line);background:white;border-radius:12px;padding:11px;text-align:left}.stageChoice.selected{outline:2px solid var(--sage);background:#eef1e9}.pinched{margin-top:10px;background:#e5eadf;border-radius:10px;padding:9px 11px;font:700 11px Arial;letter-spacing:.08em}
.home{background:#f4f0e6;min-height:100vh;padding:0 28px 36px;overflow:hidden}.homeHeader{height:64px;margin:0 -28px;background:#252b27;color:#f7f3e9;display:flex;align-items:center;padding:0 20px;gap:15px;font-family:Montserrat,Arial}.homeBack{font-size:34px}.homeTitle{font-size:17px;font-weight:600}.home .hero{height:410px;position:relative;margin:0 -28px;overflow:hidden}.heroBotanical{position:absolute;width:100%;height:285px;object-fit:cover;object-position:center top;opacity:.96}.home .brand{position:absolute;left:0;right:0;top:270px;text-align:center}.home .script{font-family:Italianno,cursive;font-size:clamp(82px,23vw,108px);line-height:.66;color:#526957}.home .diaries{margin:-3px auto 0;display:flex;align-items:center;justify-content:center;gap:15px;font:23px 'Cormorant Garamond';letter-spacing:.35em}.home .diaries:before,.home .diaries:after{content:'';height:1px;width:43px;background:#768577}.home .tag{margin-top:13px;font:500 9px Montserrat;letter-spacing:.24em;color:#69746a}.home .menu{display:grid;gap:14px}.homeNav{display:flex;align-items:center;min-height:103px;width:100%;border:1px solid #6e806f;border-radius:18px;padding:14px 18px;background:#718574;color:#fff;text-align:left}.homeNavLight{background:#f4f0e6;color:#3e5041}.homeNavIcon{width:61px;height:61px;display:grid;place-items:center;border-right:1px solid currentColor;padding-right:15px;margin-right:18px}.homeNavIcon svg{width:43px;height:43px}.homeNavCopy{flex:1}.homeNavCopy strong{display:block;font:600 19px 'Cormorant Garamond';letter-spacing:.09em}.homeNavCopy small{display:block;margin-top:7px;font:12px Montserrat}.homeNavArrow{font-size:34px}.home .quote{text-align:center;margin-top:25px;font-style:italic}
.collection{background:var(--cream);padding-bottom:105px}.collectionHero{position:relative;padding:23px 20px 20px;overflow:hidden;border-bottom:1px solid #d7d2c6}.collectionHero:after{content:'✿';position:absolute;right:-17px;top:-40px;font-size:150px;color:#788c7a;opacity:.08}.collectionHead{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}.collectionBack,.collectionAdd{border:0;background:none;color:var(--dark)}.collectionBack{font-size:42px;padding:0 10px 0 0}.collectionAdd{width:42px;height:42px;border-radius:50%;background:var(--dark);color:white;font:300 28px Arial}.collectionTitle{font:500 clamp(38px,10vw,56px)/1 'Cormorant Garamond';letter-spacing:.025em;flex:1}.collectionTag{text-align:center;margin:7px 0 2px;font:38px/1 Italianno;color:#526957}.collectionTools{padding:14px 18px 8px}.searchWrap{display:flex;align-items:center;background:#fffdf8;border:1px solid #ddd8cc;border-radius:28px;padding:0 15px}.searchIcon{font:24px Arial;color:#3d4a3e;margin-right:10px}.searchWrap input{border:0;outline:0;background:transparent;width:100%;height:50px;font:15px 'Cormorant Garamond'}.filters{display:flex;gap:8px;overflow:auto;padding:12px 0 5px;scrollbar-width:none}.filter{white-space:nowrap;border:0;border-radius:22px;background:#e9e5da;color:#485148;padding:9px 15px;font:600 11px 'Cormorant Garamond';letter-spacing:.04em}.filter.active{background:#3f5144;color:#fff}.collectionGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;padding:8px 18px}.dahliaTile{position:relative;overflow:hidden;min-height:265px;background:#fbf8ef;border:1px solid #c9c7bb;border-radius:15px;cursor:pointer}.tileArt{height:145px;position:relative;overflow:hidden;background:#e9e8dd}.tileArt img{width:100%;height:100%;object-fit:cover;filter:grayscale(.55) sepia(.12);opacity:.68;transform:scale(1.08)}.tileArt:after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,transparent 55%,#fbf8ef)}.tileMore{position:absolute;right:9px;top:9px;z-index:2;width:29px;height:29px;border:0;border-radius:50%;background:rgba(244,240,230,.9);font:bold 17px Arial;color:#39433b}.tileBody{position:relative;margin-top:-15px;padding:0 12px 12px;z-index:2}.tileName{font:600 35px/.9 'Cormorant Garamond';text-align:right;color:#243027}.tilePossible{height:28px;text-align:right;font:23px/1 Italianno;color:#536756;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tilePossible.unknown{font:italic 12px/1.4 'Cormorant Garamond';color:#8b8d83;padding-top:5px}.tileStage{display:grid;grid-template-columns:52px 1fr;gap:5px;align-items:end;margin-top:3px}.stageSketch{width:52px;height:58px;color:#35473a}.stageSketch svg{width:100%;height:100%;overflow:visible}.stageInfo{padding-bottom:3px}.stageLabel{font:600 10px 'Cormorant Garamond';letter-spacing:.08em;color:#344137}.dots{display:flex;align-items:center;gap:3px;margin-top:8px}.dots i{display:block;width:8px;height:8px;border:1px solid #aab0a7;border-radius:50%}.dots i.on{background:#355343;border-color:#355343}.dots b{height:1px;width:5px;background:#c5c8c0}.collectionEmpty{grid-column:1/-1;text-align:center;padding:45px 20px;color:#7b8178;font-style:italic}
.bottomNav{position:fixed;z-index:30;bottom:0;left:50%;transform:translateX(-50%);width:min(680px,100%);height:82px;padding:8px 9px calc(7px + env(safe-area-inset-bottom));background:rgba(255,253,248,.98);border-top:1px solid #d5d0c4;display:none;grid-template-columns:repeat(5,1fr);box-shadow:0 -4px 16px rgba(40,45,35,.06)}.bottomNav.show{display:grid}.bottomNav button{border:0;background:none;color:#252b27;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:2px;font:500 11px 'Cormorant Garamond'}.bottomNav button.active{color:#3f5b49;font-weight:700}.bottomNav svg{width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.bottomNav .leafIcon{fill:currentColor;stroke:none}
.detailHero{display:grid;grid-template-columns:1.05fr .95fr;gap:12px;align-items:center}.sketch{background:#eef0e8;border-radius:18px;padding:8px;min-height:210px;display:flex;align-items:center;justify-content:center}.sketch svg{width:100%;height:190px}.detailName .label{font-size:52px}.detailName .possible{font-size:22px}.stageRow{display:flex;align-items:center;gap:14px}.stageRow .stageicon{width:58px;height:62px;color:#394c3e}.stageRow .stageicon svg{width:100%;height:100%}.stageRow b{font:700 16px Arial;letter-spacing:.12em}.progress{display:flex;justify-content:space-between;margin-top:14px}.dot{width:9px;height:9px;border-radius:50%;background:#d0d1ca}.dot.on{background:var(--sage);box-shadow:0 0 0 4px #e4e8df}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.fact{text-align:center;padding:6px}.fact b{display:block;font:700 9px Arial;margin:6px 0}.fact span{font:12px Arial;color:#777}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.actions button{border:0;background:#ecefe8;border-radius:12px;padding:12px 6px;font:11px Arial}
@media(max-width:375px){.collectionGrid{padding-left:12px;padding-right:12px;gap:8px}.collectionTools{padding-left:12px;padding-right:12px}.dahliaTile{min-height:250px}.tileArt{height:132px}.tileName{font-size:31px}.tilePossible{font-size:21px}.tileStage{grid-template-columns:48px 1fr}.stageSketch{width:48px;height:54px}}
</style></head><body><main class="app">
<section id="home" class="screen active home"><header class="homeHeader"><span class="homeBack">‹</span><span class="homeTitle">Dahlia Diaries</span></header><div class="hero"><img class="heroBotanical" src="hero-dahlia.jpg?v=7" alt=""><div class="brand"><div class="script">Dahlia</div><div class="diaries">DIARIES</div><div class="tag">PLANT · GROW · BLOOM · REPEAT</div></div></div><nav class="menu"><button class="homeNav" onclick="show('collection')"><span class="homeNavIcon">✿</span><span class="homeNavCopy"><strong>MY DAHLIAS</strong><small>View & update my collection</small></span><span class="homeNavArrow">›</span></button><button class="homeNav homeNavLight" onclick="show('add')"><span class="homeNavIcon">＋</span><span class="homeNavCopy"><strong>ADD DAHLIA</strong><small>Add a new tuber or plant</small></span><span class="homeNavArrow">›</span></button><button class="homeNav" onclick="show('garden')"><span class="homeNavIcon">♧</span><span class="homeNavCopy"><strong>MY GARDEN</strong><small>See where everything is planted</small></span><span class="homeNavArrow">›</span></button></nav><div class="quote">Every bloom has a story</div></section>
<section id="collection" class="screen collection"><header class="collectionHero"><div class="collectionHead"><button class="collectionBack" onclick="show('home')">‹</button><div class="collectionTitle">MY DAHLIAS</div><button class="collectionAdd" onclick="show('add')">+</button></div><div class="collectionTag">Grow · Track · Bloom</div></header><div class="collectionTools"><label class="searchWrap"><span class="searchIcon">⌕</span><input id="collectionSearch" placeholder="Search dahlias..." oninput="renderCards()"></label><div id="filters" class="filters"></div></div><div id="cards" class="collectionGrid"></div></section>
<section id="detail" class="screen"><header class="topbar"><button class="back" onclick="show('collection')">‹</button><h1>Dahlia Details</h1></header><div id="detailBody" class="content"></div></section><section id="edit" class="screen"><header class="topbar"><button class="back" onclick="show('detail')">‹</button><h1>Edit Details</h1></header><div id="editBody" class="content"></div></section><section id="add" class="screen"><header class="topbar"><button class="back" onclick="show('home')">‹</button><h1>Add Dahlia</h1></header><div class="content form"><label>ORIGINAL LABEL / NAME</label><input id="newLabel"><label>POSSIBLE VARIETY</label><input id="newPossible"><label>LOCATION</label><input id="newLocation"><label>PLANTED DATE</label><input id="newDate" type="date"><button class="primary" onclick="addDahlia()">Add Dahlia</button></div></section><section id="garden" class="screen"><header class="topbar"><button class="back" onclick="show('home')">‹</button><h1>My Garden</h1></header><div class="content"><div id="gardenBody"></div></div></section></main>
<nav id="bottomNav" class="bottomNav"><button class="active" onclick="show('collection')"><svg viewBox="0 0 32 32"><path class="leafIcon" d="M15 27V15c-6 1-10-3-10-8 6-1 10 2 10 8 1-7 5-11 12-11 0 7-5 12-12 12v11z"/></svg><span>My Dahlias</span></button><button onclick="alert('Diary is next on our build list 🌿')"><svg viewBox="0 0 32 32"><path d="M4 6c5-2 9-1 12 2v20c-3-3-7-4-12-2V6Zm24 0c-5-2-9-1-12 2v20c3-3 7-4 12-2V6Z"/></svg><span>Diary</span></button><button onclick="alert('Calendar is next on our build list 🌿')"><svg viewBox="0 0 32 32"><rect x="4" y="7" width="24" height="21" rx="2"/><path d="M9 4v6M23 4v6M4 13h24M10 18h1M16 18h1M22 18h1M10 23h1M16 23h1M22 23h1"/></svg><span>Calendar</span></button><button onclick="alert('Photos are next on our build list 📷')"><svg viewBox="0 0 32 32"><rect x="4" y="6" width="24" height="22" rx="2"/><circle cx="11" cy="13" r="2"/><path d="m6 25 7-7 5 5 3-3 5 5"/></svg><span>Photos</span></button><button onclick="alert('More options coming soon 🌿')"><svg viewBox="0 0 32 32"><circle cx="7" cy="16" r="1.5" fill="currentColor"/><circle cx="16" cy="16" r="1.5" fill="currentColor"/><circle cx="25" cy="16" r="1.5" fill="currentColor"/></svg><span>More</span></button></nav>
<script>
const defaults=[{id:'ea',label:'EA',possible:'Elizabeth Ann',ident:'Possible',location:'Planter Bed 1 · Bottom Left',date:'2026-10-11',stage:'Planted',pinches:[],colour:'Not yet known',size:'Not yet known',height:'Not yet known'},{id:'snc',label:'SNC',possible:'Snow Country',ident:'Possible',location:'Flexi Tub · Tub 1',date:'2026-10-11',stage:'Planted',pinches:[],colour:'Not yet known',size:'Not yet known',height:'Not yet known'},{id:'u1',label:'Unknown 01',possible:'',ident:'Unknown',location:'Planter Bed 1 · Centre Back',date:'2026-10-11',stage:'Planted',pinches:[],colour:'Not yet known',size:'Not yet known',height:'Not yet known'},{id:'u2',label:'Unknown 02',possible:'',ident:'Unknown',location:'Planter Bed 2 · Centre',date:'2026-10-11',stage:'Planted',pinches:[],colour:'Not yet known',size:'Not yet known',height:'Not yet known'},{id:'u3',label:'Unknown 03 / BIGGEST',possible:'',ident:'Unknown',location:'Planter Bed 2 · Centre Middle Front',date:'2026-10-11',stage:'Planted',pinches:[],colour:'Not yet known',size:'Not yet known',height:'Not yet known'}];
const stages=['Tuber','Sprouting','Planted','Growing','Budding','Flowering','End of Season'];let dahlias=[];let current='ea',collectionFilter='All';try{dahlias=JSON.parse(localStorage.getItem('dahliaDiaries'))||defaults}catch(e){dahlias=defaults}function save(){localStorage.setItem('dahliaDiaries',JSON.stringify(dahlias))}function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.getElementById('bottomNav').classList.toggle('show',id==='collection');if(id==='collection')renderCards();if(id==='garden')renderGarden();if(id==='detail')renderDetail();if(id==='edit')renderEdit();scrollTo(0,0)}function niceDate(s){if(!s)return'Not yet known';const[y,m,d]=s.split('-');return`${d} ${['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'][+m-1]} ${y}`}function openD(id){current=id;show('detail')}
function stageSketch(s){let inner='';if(s==='Tuber')inner='<path d="M11 38c2-10 8-15 18-13 8 2 11 9 7 16-4 7-19 8-25-3Z"/><path d="M12 35 6 31m8 11-5 5m25-6 6 4m-4-13 6-3M19 26c-1-5 1-8 4-11"/>';if(s==='Sprouting')inner='<path d="M9 40c2-9 9-13 19-11 8 2 10 8 6 14-5 6-20 6-25-3Z"/><path d="M23 29c0-9 1-15 5-21M28 8c4 1 6 4 6 7-4 0-7-2-6-7Z"/><path d="M11 39 6 44m28-3 6 3"/>';if(s==='Planted')inner='<path d="M5 48c10-5 29-5 39 0M24 46V20M24 31c-7 0-11-4-12-10 7 0 12 3 12 10Zm0-6c6 0 10-4 11-10-7 0-11 3-11 10Z"/>';if(s==='Growing')inner='<path d="M6 50c10-4 27-4 37 0M24 48V10M24 37c-8 0-12-5-13-11 8 0 13 4 13 11Zm0-8c7 0 12-5 13-11-8 0-13 4-13 11Zm0-8c-6 0-9-4-10-9 6 0 10 3 10 9Zm0-6c5 0 9-4 10-9-6 0-10 3-10 9Z"/>';if(s==='Budding')inner='<path d="M24 49V21M24 36c-7 0-11-4-12-10 7 0 12 3 12 10Zm0-6c6 0 10-4 11-10-7 0-11 3-11 10Z"/><path d="M24 21c-5-5-4-12 0-16 5 4 6 11 0 16ZM34 27c-2-5 1-10 5-12 4 5 2 10-5 12Z"/>';if(s==='Flowering')inner='<g transform="translate(25 24)"><path d="M0-4C-4-9-3-15 0-18 4 4 4 10 0 14Z"/><path d="M0-4C-4-9-3-15 0-18 4 4 4 10 0 14Z" transform="rotate(45)"/><path d="M0-4C-4-9-3-15 0-18 4 4 4 10 0 14Z" transform="rotate(90)"/><path d="M0-4C-4-9-3-15 0-18 4 4 4 10 0 14Z" transform="rotate(135)"/><path d="M0-4C-4-9-3-15 0-18 4 4 4 10 0 14Z" transform="rotate(180)"/><path d="M0-4C-4-9-3-15 0-18 4 4 4 10 0 14Z" transform="rotate(225)"/><path d="M0-4C-4-9-3-15 0-18 4 4 4 10 0 14Z" transform="rotate(270)"/><path d="M0-4C-4-9-3-15 0-18 4 4 4 10 0 14Z" transform="rotate(315)"/><circle r="5"/></g><path d="M25 42v10"/>';if(s==='End of Season')inner='<path d="M8 50c10-4 27-4 38 0M25 48V24M25 34 13 19M25 31l11-15M13 19c-5-1-7-6-5-10 6 1 8 5 5 10Zm23-3c5-2 8-7 6-11-6 1-9 6-6 11Z"/><path d="M17 48c2-6 13-6 16 0"/>';return`<svg viewBox="0 0 50 56" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`}
function renderFilters(){const fs=['All','Planted','Growing','Budding','Flowering'];filters.innerHTML=fs.map(f=>{const c=f==='All'?dahlias.length:dahlias.filter(d=>d.stage===f).length;return`<button class="filter ${collectionFilter===f?'active':''}" onclick="collectionFilter='${f}';renderCards()">${f.toUpperCase()} (${c})</button>`}).join('')}
function tile(d){let idx=Math.max(0,Math.min(4,stages.indexOf(d.stage))),dots='';for(let i=0;i<5;i++)dots+=`${i?'<b></b>':''}<i class="${i===idx?'on':''}"></i>`;return`<article class="dahliaTile" onclick="openD('${d.id}')"><div class="tileArt"><img src="hero-dahlia.jpg?v=7"><button class="tileMore" onclick="event.stopPropagation();openD('${d.id}')">•••</button></div><div class="tileBody"><div class="tileName">${d.label}</div><div class="tilePossible ${d.possible?'':'unknown'}">${d.possible||'Variety not yet known'}</div><div class="tileStage"><div class="stageSketch">${stageSketch(d.stage)}</div><div class="stageInfo"><div class="stageLabel">${d.stage.toUpperCase()}</div><div class="dots">${dots}</div></div></div></div></article>`}function renderCards(){renderFilters();const q=(collectionSearch?.value||'').trim().toLowerCase();const shown=dahlias.filter(d=>(collectionFilter==='All'||d.stage===collectionFilter)&&(!q||[d.label,d.possible,d.location,d.stage].join(' ').toLowerCase().includes(q)));cards.innerHTML=shown.length?shown.map(tile).join(''):'<div class="collectionEmpty">No dahlias found 🌿</div>'}
function flowerSVG(){return`<svg viewBox="0 0 220 220" fill="none" stroke="#4d5149" stroke-width="1.2"><g transform="translate(110 104)"><ellipse rx="15" ry="60"/><ellipse rx="15" ry="60" transform="rotate(30)"/><ellipse rx="15" ry="60" transform="rotate(60)"/><ellipse rx="15" ry="60" transform="rotate(90)"/><ellipse rx="15" ry="60" transform="rotate(120)"/><ellipse rx="15" ry="60" transform="rotate(150)"/><circle r="13"/></g></svg>`}function renderDetail(){const d=dahlias.find(x=>x.id===current),idx=stages.indexOf(d.stage);detailBody.innerHTML=`<div class="detailHero"><div class="sketch">${flowerSVG()}</div><div class="detailName"><div class="label">${d.label}</div>${d.possible?`<div class="possible">${d.possible}</div>`:''}<span class="pill">IDENTIFICATION: ${d.ident.toUpperCase()}</span></div></div><div class="panel"><div class="stageRow"><span class="stageicon">${stageSketch(d.stage)}</span><b>${d.stage.toUpperCase()}</b></div><div class="progress">${stages.map((s,i)=>`<span class="dot ${i===idx?'on':''}"></span>`).join('')}</div></div><div class="panel"><div class="meta">⌖ ${d.location}<br>Planted ${niceDate(d.date)}</div></div><div class="panel actions"><button>View Diary</button><button>Photos</button><button onclick="show('edit')">Edit Details</button></div>`}function renderEdit(){const d=dahlias.find(x=>x.id===current);editBody.innerHTML=`<div class="form panel"><label>ORIGINAL LABEL</label><input id="eLabel" value="${d.label}"><label>POSSIBLE VARIETY</label><input id="ePossible" value="${d.possible||''}"><label>LOCATION</label><input id="eLocation" value="${d.location}"><label>PLANTED DATE</label><input id="eDate" type="date" value="${d.date}"><label>CURRENT STAGE</label><div class="stageChoices">${stages.map(s=>`<button type="button" class="stageChoice ${s===d.stage?'selected':''}" onclick="pickStage('${s}',this)">${stageSketch(s)} ${s}</button>`).join('')}</div><input id="eStage" type="hidden" value="${d.stage}"><button class="primary" onclick="saveEdit()">Save Changes</button></div>`}function pickStage(s,el){eStage.value=s;document.querySelectorAll('.stageChoice').forEach(x=>x.classList.remove('selected'));el.classList.add('selected')}function saveEdit(){const d=dahlias.find(x=>x.id===current);d.label=eLabel.value||d.label;d.possible=ePossible.value;d.location=eLocation.value;d.date=eDate.value;d.stage=eStage.value;save();show('detail')}function addDahlia(){const label=newLabel.value.trim();if(!label)return alert('Give this dahlia a label first 🌱');dahlias.push({id:'d'+Date.now(),label,possible:newPossible.value.trim(),ident:newPossible.value.trim()?'Possible':'Unknown',location:newLocation.value.trim()||'Not yet recorded',date:newDate.value,stage:'Tuber',pinches:[],colour:'Not yet known',size:'Not yet known',height:'Not yet known'});save();show('collection')}function renderGarden(){const groups={};dahlias.forEach(d=>(groups[d.location]??=[]).push(d));gardenBody.innerHTML=Object.entries(groups).map(([l,ds])=>`<div class="card"><b>${l}</b><div class="meta">${ds.map(d=>d.label).join('<br>')}</div></div>`).join('')}
</script></body></html>
