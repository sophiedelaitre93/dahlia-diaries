<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#252b27"><meta name="color-scheme" content="light"><title>Dahlia Diaries</title><style>
@import url('https://fonts.googleapis.com/css2?family=Italianno&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Montserrat:wght@400;500;600&display=swap');
:root{--cream:#f4f0e6;--paper:#fffdf8;--ink:#262821;--sage:#718574;--sage2:#dfe5d8;--line:#d8d2c5;--dark:#252b27}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Georgia,'Times New Roman',serif}button,input,select{font:inherit}.app{max-width:680px;margin:auto;min-height:100vh}.screen{display:none;min-height:100vh}.screen.active{display:block}.topbar{position:sticky;top:0;z-index:10;background:rgba(245,241,231,.96);display:flex;align-items:center;gap:12px;padding:18px;border-bottom:1px solid var(--line)}.back{border:0;background:none;font-size:30px}.topbar h1{font-size:27px;margin:0;font-weight:500}.content{padding:18px}.card,.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:14px}.label{font-size:34px}.possible{font-style:italic;font-size:18px}.pill{display:inline-block;margin-top:8px;background:var(--sage2);padding:6px 9px;border-radius:999px;font:10px Arial;letter-spacing:.12em}.meta{margin-top:10px;color:#686b62;font:13px Arial;line-height:1.5}.primary,.secondary{border:0;border-radius:12px;padding:12px 14px;margin-top:12px}.primary{background:var(--dark);color:white}.secondary{background:var(--sage2)}.form label{display:block;font:700 11px Arial;letter-spacing:.1em;margin:14px 0 6px}.form input,.form select{width:100%;border:1px solid var(--line);background:white;border-radius:12px;padding:12px}.stageChoices{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stageChoice{border:1px solid var(--line);background:white;border-radius:12px;padding:11px;text-align:left}.stageChoice.selected{outline:2px solid var(--sage);background:#eef1e9}.pinched{margin-top:10px;background:#e5eadf;border-radius:10px;padding:9px 11px;font:700 11px Arial;letter-spacing:.08em}
.home{background:#f4f0e6;min-height:100vh;padding:0 28px 36px;overflow:hidden}.homeHeader{height:64px;margin:0 -28px;background:#252b27;color:#f7f3e9;display:flex;align-items:center;padding:0 20px;gap:15px;font-family:Montserrat,Arial}.homeBack{font-size:34px}.homeTitle{font-size:17px;font-weight:600}.home .hero{height:410px;position:relative;margin:0 -28px;overflow:hidden}.heroBotanical{position:absolute;width:100%;height:285px;object-fit:cover;object-position:center top;opacity:.96}.home .brand{position:absolute;left:0;right:0;top:270px;text-align:center;background:var(--cream);z-index:2}.home .script{font-family:Italianno,cursive;font-size:clamp(82px,23vw,108px);line-height:.66;color:#526957}.home .diaries{margin:-3px auto 0;display:flex;align-items:center;justify-content:center;gap:15px;font:23px 'Cormorant Garamond';letter-spacing:.35em}.home .diaries:before,.home .diaries:after{content:'';height:1px;width:43px;background:#768577}.home .tag{margin-top:13px;font:500 9px Montserrat;letter-spacing:.24em;color:#69746a}.home .menu{display:grid;gap:14px}.homeNav{display:flex;align-items:center;min-height:103px;width:100%;border:1px solid #6e806f;border-radius:18px;padding:14px 18px;background:#718574;color:#fff;text-align:left}.homeNavLight{background:#f4f0e6;color:#3e5041}.homeNavIcon{width:61px;height:61px;display:grid;place-items:center;border-right:1px solid currentColor;padding-right:15px;margin-right:18px}.homeNavCopy{flex:1}.homeNavCopy strong{display:block;font:600 19px 'Cormorant Garamond';letter-spacing:.09em}.homeNavCopy small{display:block;margin-top:7px;font:12px Montserrat}.homeNavArrow{font-size:34px}.home .quote{text-align:center;margin-top:25px;font-style:italic}
.collection{background:var(--cream);padding-bottom:105px}.collectionHero{position:relative;padding:23px 20px 20px;overflow:hidden;border-bottom:1px solid #d7d2c6}.collectionHero:after{content:'✿';position:absolute;right:-17px;top:-40px;font-size:150px;color:#788c7a;opacity:.08}.collectionHead{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}.collectionBack,.collectionAdd{border:0;background:none;color:var(--dark)}.collectionBack{font-size:42px;padding:0 10px 0 0}.collectionAdd{width:42px;height:42px;border-radius:50%;background:var(--dark);color:white;font:300 28px Arial}.collectionTitle{font:500 clamp(38px,10vw,56px)/1 'Cormorant Garamond';letter-spacing:.025em;flex:1}.collectionTag{text-align:center;margin:7px 0 2px;font:38px/1 Italianno;color:#526957}.collectionTools{padding:14px 18px 8px}.searchWrap{display:flex;align-items:center;background:#fffdf8;border:1px solid #ddd8cc;border-radius:28px;padding:0 15px}.searchIcon{font:24px Arial;color:#3d4a3e;margin-right:10px}.searchWrap input{border:0;outline:0;background:transparent;width:100%;height:50px;font:15px 'Cormorant Garamond'}.filters{display:flex;gap:8px;overflow:auto;padding:12px 0 5px;scrollbar-width:none}.filter{white-space:nowrap;border:0;border-radius:22px;background:#e9e5da;color:#485148;padding:9px 15px;font:600 11px 'Cormorant Garamond';letter-spacing:.04em}.filter.active{background:#3f5144;color:#fff}.collectionGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;padding:8px 18px}.dahliaTile{position:relative;overflow:hidden;min-height:265px;background:#fbf8ef;border:1px solid #c9c7bb;border-radius:15px;cursor:pointer}.tileArt{height:145px;position:relative;overflow:hidden;background:#e9e8dd}.tileArt img{width:100%;height:100%;object-fit:cover;filter:grayscale(.55) sepia(.12);opacity:.68;transform:scale(1.08)}.tileArt:after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,transparent 55%,#fbf8ef)}.tileMore{position:absolute;right:9px;top:9px;z-index:2;width:29px;height:29px;border:0;border-radius:50%;background:rgba(244,240,230,.9);font:bold 17px Arial;color:#39433b}.tileBody{position:relative;margin-top:-15px;padding:0 12px 12px;z-index:2}.tileName{font:600 35px/.9 'Cormorant Garamond';text-align:right;color:#243027}.tilePossible{height:28px;text-align:right;font:23px/1 Italianno;color:#536756;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tilePossible.unknown{font:italic 12px/1.4 'Cormorant Garamond';color:#8b8d83;padding-top:5px}.tileStage{display:grid;grid-template-columns:52px 1fr;gap:5px;align-items:end;margin-top:3px}.stageSketch{width:52px;height:58px;color:#35473a}.stageSketch svg{width:100%;height:100%;overflow:visible}.stageInfo{padding-bottom:3px}.stageLabel{font:600 10px 'Cormorant Garamond';letter-spacing:.08em;color:#344137}.dots{display:flex;align-items:center;gap:3px;margin-top:8px}.dots i{display:block;width:8px;height:8px;border:1px solid #aab0a7;border-radius:50%}.dots i.on{background:#355343;border-color:#355343}.dots b{height:1px;width:5px;background:#c5c8c0}.collectionEmpty{grid-column:1/-1;text-align:center;padding:45px 20px;color:#7b8178;font-style:italic}.bottomNav{position:fixed;z-index:30;bottom:0;left:50%;transform:translateX(-50%);width:min(680px,100%);height:82px;padding:8px 9px calc(7px + env(safe-area-inset-bottom));background:rgba(255,253,248,.98);border-top:1px solid #d5d0c4;display:none;grid-template-columns:repeat(5,1fr)}.bottomNav.show{display:grid}.bottomNav button{border:0;background:none;color:#252b27;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:2px;font:500 11px 'Cormorant Garamond'}.bottomNav button.active{color:#3f5b49;font-weight:700}.bottomNav svg{width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.bottomNav .leafIcon{fill:currentColor;stroke:none}
</style></head><body><main class="app"><section id="home" class="screen active home"><header class="homeHeader"><span class="homeBack">‹</span><span class="homeTitle">Dahlia Diaries</span></header><div class="hero"><img class="heroBotanical" src="hero-dahlia.jpg?v=7" alt=""><div class="brand"><div class="script">Dahlia</div><div class="diaries">DIARIES</div><div class="tag">PLANT · GROW · BLOOM · REPEAT</div></div></div><nav class="menu"><button class="homeNav" onclick="show('collection')"><span class="homeNavIcon">✿</span><span class="homeNavCopy"><strong>MY DAHLIAS</strong><small>View & update my collection</small></span><span class="homeNavArrow">›</span></button><button class="homeNav homeNavLight" onclick="show('add')"><span class="homeNavIcon">＋</span><span class="homeNavCopy"><strong>ADD DAHLIA</strong><small>Add a new tuber or plant</small></span><span class="homeNavArrow">›</span></button><button class="homeNav" onclick="show('garden')"><span class="homeNavIcon">♧</span><span class="homeNavCopy"><strong>MY GARDEN</strong><small>See where everything is planted</small></span><span class="homeNavArrow">›</span></button></nav><div class="quote">Every bloom has a story</div></section><section id="collection" class="screen collection"><header class="collectionHero"><div class="collectionHead"><button class="collectionBack" onclick="show('home')">‹</button><div class="collectionTitle">MY DAHLIAS</div><button class="collectionAdd" onclick="show('add')">+</button></div><div class="collectionTag">Grow · Track · Bloom</div></header><div class="collectionTools"><label class="searchWrap"><span class="searchIcon">⌕</span><input id="collectionSearch" placeholder="Search dahlias..." oninput="renderCards()"></label><div id="filters" class="filters"></div></div><div id="cards" class="collectionGrid"></div></section><section id="add" class="screen"><header class="topbar"><button class="back" onclick="show('home')">‹</button><h1>Add Dahlia</h1></header></section><section id="garden" class="screen"><header class="topbar"><button class="back" onclick="show('home')">‹</button><h1>My Garden</h1></header></section></main><nav id="bottomNav" class="bottomNav"><button class="active" onclick="show('collection')"><svg viewBox="0 0 32 32"><path class="leafIcon" d="M15 27V15c-6 1-10-3-10-8 6-1 10 2 10 8 1-7 5-11 12-11 0 7-5 12-12 12v11z"/></svg><span>My Dahlias</span></button><button><span>Diary</span></button><button><span>Calendar</span></button><button><span>Photos</span></button><button><span>More</span></button></nav><script>const defaults=[{id:'ea',label:'EA',possible:'Elizabeth Ann',stage:'Planted'},{id:'snc',label:'SNC',possible:'Snow Country',stage:'Planted'},{id:'u1',label:'Unknown 01',possible:'',stage:'Planted'},{id:'u2',label:'Unknown 02',possible:'',stage:'Planted'},{id:'u3',label:'Unknown 03 / BIGGEST',possible:'',stage:'Planted'}];let dahlias=[];let collectionFilter='All';try{dahlias=JSON.parse(localStorage.getItem('dahliaDiaries'))||defaults}catch(e){dahlias=defaults}function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.getElementById('bottomNav').classList.toggle('show',id==='collection');if(id==='collection')renderCards();scrollTo(0,0)}function renderFilters(){const fs=['All','Planted','Growing','Budding','Flowering'];filters.innerHTML=fs.map(f=>`<button class="filter ${collectionFilter===f?'active':''}" onclick="collectionFilter='${f}';renderCards()">${f.toUpperCase()} (${f==='All'?dahlias.length:dahlias.filter(d=>d.stage===f).length})</button>`).join('')}function renderCards(){renderFilters();const q=(collectionSearch?.value||'').toLowerCase();const shown=dahlias.filter(d=>(collectionFilter==='All'||d.stage===collectionFilter)&&(!q||(d.label+' '+d.possible).toLowerCase().includes(q)));cards.innerHTML=shown.map(d=>`<article class="dahliaTile"><div class="tileArt"><img src="hero-dahlia.jpg?v=7"><button class="tileMore">•••</button></div><div class="tileBody"><div class="tileName">${d.label}</div><div class="tilePossible ${d.possible?'':'unknown'}">${d.possible||'Variety not yet known'}</div><div class="tileStage"><div class="stageSketch">🌱</div><div class="stageInfo"><div class="stageLabel">${d.stage.toUpperCase()}</div></div></div></div></article>`).join('')}</script></body></html>
