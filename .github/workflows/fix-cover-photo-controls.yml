name: Fix cover photo text and removal controls
on:
  push:
    paths:
      - '.github/workflows/fix-cover-photo-controls.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix cover photo behavior only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          # Hide the empty-state copy whenever a saved/selected cover is showing.
          anchor='.profileArt.hasCover .profileCoverImg{display:block}'
          if anchor not in s: raise SystemExit('cover image CSS anchor not found')
          if '.profileArt.hasCover .coverEmpty{display:none}' not in s:
              s=s.replace(anchor,anchor+'.profileArt.hasCover .coverEmpty{display:none}',1)
          # Add a remove button beside the existing Change Cover button.
          change='</button><input id="coverFile"'
          if change not in s: raise SystemExit('cover input anchor not found')
          remove='</button><button class="removeCover" id="removeCover" type="button">Remove Cover</button><input id="coverFile"'
          s=s.replace(change,remove,1)
          # Style remove control and only show it while a cover exists.
          css='.changeCover svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8}'
          if css not in s: raise SystemExit('change cover CSS anchor not found')
          extra='.removeCover{display:none;position:absolute;right:12px;bottom:12px;z-index:4;border:0;border-radius:24px;background:rgba(218,216,202,.94);color:#35493c;padding:8px 13px;font-size:13px}.profileArt.hasCover .removeCover{display:block}'
          s=s.replace(css,css+extra,1)
          # Wire removal into the existing localStorage cover system.
          js='coverFile.addEventListener(\'change\','
          pos=s.find(js)
          if pos < 0: raise SystemExit('cover change JS anchor not found')
          insert="const removeCover=document.getElementById('removeCover');removeCover.addEventListener('click',()=>{localStorage.removeItem('dahliaCover:'+currentId);profileCoverImg.removeAttribute('src');profileArt.classList.remove('hasCover');coverFile.value='';});"
          s=s[:pos]+insert+s[pos:]
          p.write_text(s)
          PY
      - name: Commit update
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix cover photo text and removal controls'
          git push
