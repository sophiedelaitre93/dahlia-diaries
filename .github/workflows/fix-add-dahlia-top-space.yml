name: Fix Add Dahlia top space
on:
  push:
    paths:
      - '.github/workflows/fix-add-dahlia-top-space.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove top gap on Add Dahlia screen
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          rule='<style id="add-dahlia-top-fix">#addDahliaNew{min-height:0!important;height:auto!important;padding-top:0!important;margin-top:0!important}#addDahliaNew.active{display:block!important}#addDahliaNew .addDahliaHead{margin-top:0!important}</style>'
          if 'id="add-dahlia-top-fix"' not in s:
              s=s.replace('</head>',rule+'</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Remove Add Dahlia top gap"
          git push
