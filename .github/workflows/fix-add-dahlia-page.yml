name: Fix Add Dahlia page
on:
  push:
    paths:
      - '.github/workflows/fix-add-dahlia-page.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add working Add Dahlia screen and navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='''<style id="add-dahlia-fix">.addDahliaPage{background:var(--cream);padding-bottom:40px}.addDahliaHead{height:72px;display:flex;align-items:center;padding:0 18px;border-bottom:1px solid #d7d2c6}.addDahliaHead button{border:0;background:none;font-size:38px;color:#26342b}.addDahliaHead h1{margin:0 0 0 10px;font-size:38px;font-weight:500}.addDahliaForm{padding:22px 20px}.addDahliaIntro{font:30px/1 Italianno;color:#526957;margin-bottom:24px}.addField{display:block;margin-bottom:18px}.addField span{display:block;font:600 10px Montserrat;letter-spacing:.12em;color:#59675c;margin:0 0 7px 4px}.addField input,.addField select,.addField textarea{width:100%;border:1px solid #cfcabd;border-radius:14px;background:#fffdf8;color:#26342b;padding:14px;font-size:17px;outline:none}.addField textarea{min-height:100px;resize:vertical}.addSave{width:100%;border:0;border-radius:16px;background:#35493c;color:white;padding:16px;font:600 14px Montserrat;letter-spacing:.08em}</style>'''
          if 'id="add-dahlia-fix"' not in s:
              s=s.replace('</head>',css+'</head>',1)
          screen='''<section id="addDahliaNew" class="screen addDahliaPage"><div class="addDahliaHead"><button type="button" onclick="ddShowHome()">‹</button><h1>Add Dahlia</h1></div><form class="addDahliaForm" onsubmit="return ddSaveDahlia(event)"><div class="addDahliaIntro">Add a new dahlia to your diary</div><label class="addField"><span>NAME / LABEL</span><input id="ddName" required placeholder="e.g. Dahlia 1 or Café au Lait"></label><label class="addField"><span>VARIETY / POSSIBLE ID</span><input id="ddVariety" placeholder="If known"></label><label class="addField"><span>COLOUR</span><input id="ddColour" placeholder="e.g. Pink, cream, burgundy"></label><label class="addField"><span>FLOWER SIZE</span><input id="ddSize" placeholder="e.g. Small, medium, dinnerplate"></label><label class="addField"><span>CURRENT GROWTH STAGE</span><select id="ddStage"><option>Tuber</option><option>Eye visible</option><option>Sprouted</option><option>Planted</option><option>Growing</option><option>Budding</option><option>Flowering</option></select></label><label class="addField"><span>DATE PLANTED</span><input id="ddPlanted" type="date"></label><label class="addField"><span>NOTES</span><textarea id="ddNotes" placeholder="Anything you want to remember..."></textarea></label><button class="addSave" type="submit">SAVE DAHLIA</button></form></section>'''
          if 'id="addDahliaNew"' not in s:
              s=s.replace('</body>',screen+'</body>',1)
          js='''<script id="add-dahlia-nav-fix">function ddShow(id){document.querySelectorAll('.screen').forEach(function(x){x.classList.remove('active')});var el=document.getElementById(id);if(el)el.classList.add('active');}function ddShowHome(){var home=document.querySelector('.screen.home')||document.querySelector('.home');document.querySelectorAll('.screen').forEach(function(x){x.classList.remove('active')});if(home)home.classList.add('active');}function ddSaveDahlia(e){e.preventDefault();var item={name:document.getElementById('ddName').value,variety:document.getElementById('ddVariety').value,colour:document.getElementById('ddColour').value,size:document.getElementById('ddSize').value,stage:document.getElementById('ddStage').value,planted:document.getElementById('ddPlanted').value,notes:document.getElementById('ddNotes').value};var a=JSON.parse(localStorage.getItem('dahliaDiariesUserDahlias')||'[]');a.push(item);localStorage.setItem('dahliaDiariesUserDahlias',JSON.stringify(a));alert('Dahlia saved');ddShowHome();return false;}document.addEventListener('DOMContentLoaded',function(){var buttons=[].slice.call(document.querySelectorAll('.homeNav'));buttons.forEach(function(b){var t=(b.textContent||'').replace(/\\s+/g,' ').trim().toUpperCase();if(t.indexOf('ADD DAHLIA')!==-1){b.onclick=function(){ddShow('addDahliaNew')};}});});</script>'''
          if 'id="add-dahlia-nav-fix"' not in s:
              s=s.replace('</body>',js+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Make Add Dahlia open a working entry page"
          git push
