name: Apply dahlia profile prototype
on:
  push:
    paths:
      - '.github/workflows/profile-prototype.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update individual dahlia profile only
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old_css=".profileHero{display:grid;grid-template-columns:58% 42%;min-height:270px;background:#f5f1e7}.profileArt{position:relative;overflow:hidden}.profileArt img{width:100%;height:100%;object-fit:cover;object-position:100% 0%;filter:grayscale(1) sepia(.12) saturate(.45) contrast(.86) brightness(1.08);opacity:.82}.profileArt:before{content:'';position:absolute;z-index:2;left:0;bottom:0;width:70%;height:34px;background:#f5f1e7;pointer-events:none}.profileArt:after{content:'';position:absolute;z-index:3;inset:0;background:linear-gradient(90deg,transparent 65%,#f8f4e9 100%);pointer-events:none}.profileIdentity{display:flex;flex-direction:column;justify-content:center;padding:16px 12px 12px 0}.detailLabel{font-size:66px;line-height:.82;font-weight:600;color:#26342b}.detailName{font:35px/1 Italianno;color:#536756;margin:9px 0}.idStatus{display:inline-block;align-self:flex-start;background:#e8e4d8;border-radius:15px;padding:6px 9px;font:500 7px Montserrat;letter-spacing:.08em;color:#59655b}"
          new_css=".profileHero{display:grid;grid-template-columns:58% 42%;min-height:300px;background:#faf7ed;gap:12px;padding:0 12px 12px}.profileArt{position:relative;overflow:hidden;background:#f3efe4;border:1px solid #aeb8aa;border-radius:0 0 18px 18px;display:flex;align-items:center;justify-content:center}.profileArt:before,.profileArt:after{content:none}.profileCoverImg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}.profileArt.hasCover .profileCoverImg{display:block}.coverEmpty{text-align:center;color:#687369;padding:20px}.coverFlower{font-size:44px;line-height:1;margin-bottom:10px;color:#718574}.coverEmptyText{font:500 10px/1.7 Montserrat;letter-spacing:.22em}.changeCover{position:absolute;left:12px;bottom:12px;z-index:4;border:0;border-radius:24px;background:rgba(218,216,202,.94);color:#35493c;padding:8px 13px;font-size:14px;display:flex;align-items:center;gap:7px}.changeCover svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8}.profileIdentity{display:flex;flex-direction:column;justify-content:center;padding:20px 0 10px}.detailLabel{font-size:66px;line-height:.82;font-weight:600;color:#26342b}.detailName{font:31px/1 Italianno;color:#26342b;margin:9px 0 12px}.detailName:before{content:'Possible: ';font-family:Italianno}.idStatus{display:inline-block;align-self:stretch;background:#e8e4d8;border-radius:18px;padding:8px 9px;font:500 7px Montserrat;letter-spacing:.08em;color:#59655b;text-align:center}.identifyBtn{margin-top:12px;min-height:74px;border:1px solid #d5d0c4;border-radius:14px;background:#f1ede2;color:#26342b;padding:10px;display:grid;grid-template-columns:42px 1fr 14px;align-items:center;text-align:left;font-size:12px;line-height:1.35;letter-spacing:.03em}.identifyBtn svg{width:38px;height:38px;fill:none;stroke:#35493c;stroke-width:1.6}.identifyBtn b{font-weight:500}.identifyBtn em{font-style:normal;font-size:24px}.colourSwatches{display:flex;justify-content:center;gap:4px;margin:3px 0 6px}.colourSwatches i{width:18px;height:18px;border-radius:50%;display:block}.colourSwatches i:nth-child(1){background:#dfe4d5}.colourSwatches i:nth-child(2){background:#c9d2bb}.colourSwatches i:nth-child(3){background:#aebd9d}.colourSwatches i:nth-child(4){background:#829a7d}.colourSwatches i:nth-child(5){background:#526d57}.rulerIcon{width:38px;height:30px;transform:rotate(-45deg)}"
          if old_css not in s: raise SystemExit('profile CSS anchor not found')
          s=s.replace(old_css,new_css,1)
          old_html='<div class="profileHero"><div class="profileArt"><img src="hero-dahlia.jpg?v=7" alt=""></div><div class="profileIdentity"><div id="detailLabel" class="detailLabel"></div><div id="detailName" class="detailName"></div><div class="idStatus">IDENTIFICATION: POSSIBLE</div></div></div>'
          new_html='''<div class="profileHero"><div id="profileArt" class="profileArt"><img id="profileCoverImg" class="profileCoverImg" alt=""><div class="coverEmpty"><div class="coverFlower">✿</div><div class="coverEmptyText">NO COVER IMAGE<br>SET YET</div></div><button class="changeCover" type="button" onclick="coverInput.click()"><svg viewBox="0 0 28 28"><path d="M5 9h5l2-3h5l2 3h4v14H5z"/><circle cx="14" cy="16" r="4"/></svg>Change Cover</button><input id="coverInput" type="file" accept="image/*" hidden onchange="changeCover(event)"></div><div class="profileIdentity"><div id="detailLabel" class="detailLabel"></div><div id="detailName" class="detailName"></div><div class="idStatus">🌱 &nbsp; IDENTIFICATION: POSSIBLE</div><button class="identifyBtn" type="button" onclick="openEdit()"><svg viewBox="0 0 48 48"><path d="M14 38V18M14 25c-7 0-10-4-10-10 7 0 10 4 10 10Zm0-5c6 0 10-4 10-10-7 0-10 4-10 10Z"/><circle cx="31" cy="28" r="9"/><path d="m37 35 7 7"/></svg><b>CONFIRM OR<br>CHANGE IDENTIFICATION</b><em>›</em></button></div></div>'''
          if old_html not in s: raise SystemExit('profile HTML anchor not found')
          s=s.replace(old_html,new_html,1)
          old_colour='<div class="specIcon"><img src="colour-swatch.svg?v=1" alt="" style="width:40px;height:34px;object-fit:contain"></div><span>COLOUR</span><strong id="detailColour">Not yet known</strong>'
          new_colour='<div class="specIcon"><svg viewBox="0 0 40 32"><path d="M8 26c-5-4-5-12 0-17 7-7 22-5 25 4 2 6-2 8-6 7-3-1-5 1-5 4 0 4-8 7-14 2Z"/><circle cx="12" cy="13" r="2"/><circle cx="19" cy="10" r="2"/><circle cx="26" cy="13" r="2"/></svg></div><span>COLOUR</span><div class="colourSwatches"><i></i><i></i><i></i><i></i><i></i></div><strong id="detailColour">Not yet known</strong>'
          if old_colour not in s: raise SystemExit('colour anchor not found')
          s=s.replace(old_colour,new_colour,1)
          old_size='<div class="specIcon"><img src="flower-size-icon.png?v=1" alt="" style="width:40px;height:34px;object-fit:contain"></div><span>FLOWER SIZE</span>'
          new_size='<div class="specIcon"><svg class="rulerIcon" viewBox="0 0 44 24"><rect x="2" y="5" width="40" height="14" rx="2"/><path d="M9 5v6M15 5v4M21 5v6M27 5v4M33 5v6"/></svg></div><span>FLOWER SIZE</span>'
          if old_size not in s: raise SystemExit('size anchor not found')
          s=s.replace(old_size,new_size,1)
          old_render="detailLabel.textContent=d.label;detailName.textContent=d.possible||'Variety not yet known';detailStageName.textContent=d.stage;"
          new_render="detailLabel.textContent=d.label;detailName.textContent=d.possible||'Variety not yet known';const cover=localStorage.getItem('dahliaCover:'+d.id);profileArt.classList.toggle('hasCover',!!cover);if(cover)profileCoverImg.src=cover;detailStageName.textContent=d.stage;"
          if old_render not in s: raise SystemExit('render anchor not found')
          s=s.replace(old_render,new_render,1)
          anchor="function renderStagePicker(){stagePicker.innerHTML=stages.map(s=>`<button type=\"button\" class=\"stageChoice ${editStage.value===s?'selected':''}\" onclick=\"editStage.value='${s}';renderStagePicker()\">${stageSketch(s)}<span>${s}</span></button>`).join('')}"
          addition=anchor+"\nfunction changeCover(e){const f=e.target.files&&e.target.files[0];if(!f||!selectedId)return;const img=new Image(),r=new FileReader();r.onload=()=>{img.onload=()=>{const max=1200,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);try{localStorage.setItem('dahliaCover:'+selectedId,c.toDataURL('image/jpeg',.82));renderDetail()}catch(err){alert('That photo is too large to save. Please choose a smaller image.')}};img.src=r.result};r.readAsDataURL(f);e.target.value=''}"
          if anchor not in s: raise SystemExit('JS anchor not found')
          s=s.replace(anchor,addition,1)
          p.write_text(s)
      - name: Commit profile update
        run: |
          git config user.name "sophiedelaitre93"
          git config user.email "sophie.delaitre93@gmail.com"
          git add index.html
          git commit -m "Apply approved individual dahlia profile prototype"
          git push
