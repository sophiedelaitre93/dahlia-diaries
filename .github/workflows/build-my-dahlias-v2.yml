name: Build My Dahlias saved collection
on:
  push:
    paths:
      - '.github/workflows/build-my-dahlias-v2.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add My Dahlias collection
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          if 'id="myDahliasSaved"' not in s:
            block='''<style id="my-dahlias-saved-style">#myDahliasSaved{display:none}#myDahliasSaved.active{position:fixed!important;inset:0!important;z-index:100!important;display:block!important;overflow-y:auto!important;-webkit-overflow-scrolling:touch;background:var(--cream)!important;width:100%!important;height:100dvh!important;min-height:100dvh!important;margin:0!important;padding:0 0 40px!important}.mdHead{padding:calc(10px + env(safe-area-inset-top)) 18px 8px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #d7d1c4}.mdHead button{border:0;background:none;color:#26342b;font-size:40px;line-height:1;padding:0}.mdHead h1{margin:0;font-size:42px;color:#26342b;font-weight:500}.mdIntro{font-style:italic;color:var(--sage);font-size:27px;padding:8px 22px 14px}.mdList{padding:4px 18px 30px;display:grid;gap:14px}.mdCard{background:var(--paper);border:1px solid #d7d1c4;border-radius:24px;padding:18px 20px}.mdCard h2{margin:0 0 4px;color:#26342b;font-size:31px;font-weight:500}.mdSub{color:var(--sage);font-style:italic;font-size:21px;margin-bottom:12px}.mdGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}.mdLab{display:block;font-family:Arial,sans-serif;font-size:11px;letter-spacing:1.3px;color:#657268;font-weight:700}.mdVal{font-size:18px;color:#33372f}.mdEmpty{text-align:center;padding:70px 28px;color:#657268;font-size:22px}</style><section id="myDahliasSaved" class="screen"><div class="mdHead"><button type="button" onclick="mdClose()">‹</button><h1>My Dahlias</h1></div><div class="mdIntro">My growing collection</div><div id="mdList" class="mdList"></div></section><script id="my-dahlias-saved-script">function mdEsc(v){var d=document.createElement('div');d.textContent=v==null?'':v;return d.innerHTML}function mdRender(){var l=document.getElementById('mdList'),a=[];try{a=JSON.parse(localStorage.getItem('dahliaDiariesUserDahlias')||'[]')}catch(e){}if(!a.length){l.innerHTML='<div class="mdEmpty">No dahlias added yet.</div>';return}l.innerHTML=a.map(function(x){var bits=[['COLOUR',x.colour],['FLOWER SIZE',x.size],['STAGE',x.stage],['DATE PLANTED',x.planted],['HEIGHT PLANTED',x.plantedHeight?x.plantedHeight+' cm':''],['LOCATION',x.location]].filter(function(z){return z[1]});return '<article class="mdCard"><h2>'+mdEsc(x.name||'Unnamed Dahlia')+'</h2>'+(x.variety?'<div class="mdSub">'+mdEsc(x.variety)+'</div>':'')+'<div class="mdGrid">'+bits.map(function(z){return '<div><span class="mdLab">'+z[0]+'</span><span class="mdVal">'+mdEsc(z[1])+'</span></div>'}).join('')+'</div>'+(x.notes?'<div style="margin-top:14px"><span class="mdLab">NOTES</span><span class="mdVal">'+mdEsc(x.notes)+'</span></div>':'')+'</article>'}).join('')}function mdOpen(){document.querySelectorAll('.screen').forEach(function(x){x.classList.remove('active')});document.getElementById('myDahliasSaved').classList.add('active');mdRender()}function mdClose(){document.getElementById('myDahliasSaved').classList.remove('active');ddShowHome()}document.addEventListener('DOMContentLoaded',function(){document.querySelectorAll('.homeNav').forEach(function(b){var t=(b.textContent||'').replace(/\\s+/g,' ').trim().toUpperCase();if(t.indexOf('MY DAHLIAS')!==-1)b.onclick=mdOpen})});</script>'''
            s=s.replace('</body>',block+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add index.html
          git diff --cached --quiet || git commit -m 'Show saved dahlias in My Dahlias'
          git push
