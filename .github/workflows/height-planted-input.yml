name: Height planted input
on:
  push:
    paths:
      - '.github/workflows/height-planted-input.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update add dahlia form
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          anchor = '<label class="addField"><span>DATE PLANTED</span><input id="ddPlanted" type="date"></label>'
          field = '<label class="addField"><span>HEIGHT WHEN PLANTED (CM)</span><input id="ddPlantedHeight" type="number" min="0" step="0.5" placeholder="e.g. 12"></label>'
          if 'ddPlantedHeight' not in s:
              if anchor not in s:
                  raise SystemExit('Date planted field not found')
              s = s.replace(anchor, anchor + field, 1)
          old = "planted:document.getElementById('ddPlanted').value,notes:"
          new = "planted:document.getElementById('ddPlanted').value,plantedHeight:document.getElementById('ddPlantedHeight').value,notes:"
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add height when planted input"
          git push
