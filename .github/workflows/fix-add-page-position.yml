name: Fix add page position
on:
  push:
    paths:
      - '.github/workflows/fix-add-page-position.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move Add Dahlia screen into app container
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start=s.find('<section id="addDahliaNew"')
          if start < 0: raise SystemExit('Add Dahlia screen not found')
          end=s.find('</section>',start)
          if end < 0: raise SystemExit('Add Dahlia closing tag not found')
          end += len('</section>')
          section=s[start:end]
          s=s[:start]+s[end:]
          app_end=s.rfind('</div>',0,s.find('</body>'))
          if app_end < 0: raise SystemExit('App closing div not found')
          s=s[:app_end]+section+s[app_end:]
          css='<style id="add-page-position-fix">#addDahliaNew{position:relative!important;top:auto!important;left:auto!important;transform:none!important;margin:0!important;padding-top:0!important;min-height:100vh!important}#addDahliaNew .addDahliaHead{margin:0!important}</style>'
          if 'id="add-page-position-fix"' not in s:
              s=s.replace('</head>',css+'</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix Add Dahlia page position"
          git push
