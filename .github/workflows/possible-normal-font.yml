name: Use normal font for Possible label
on:
  push:
    paths:
      - '.github/workflows/possible-normal-font.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Change Possible label font only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          old=".detailName:before{content:'Possible: ';font-family:Italianno}"
          new=".detailName:before{content:'Possible: ';font-family:Montserrat,Arial,sans-serif;font-size:15px;font-weight:400;letter-spacing:.04em;font-style:normal}"
          if old not in s: raise SystemExit('Expected Possible label style not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Use normal font for Possible label"
          git push
